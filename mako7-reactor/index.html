<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FF7 BOMBING MISSION — 壱番魔晄炉</title>
<style>
:root{
  --mako:#2aff9e; --mako-dim:#0f8f5c; --mako-deep:#063d28;
  --steel:#22332c; --steel-hi:#3d574b;
  --amber:#ffb020; --danger:#ff4a3d; --volt:#ffe95c; --cyan:#58d8ff;
  --ink:#e9edff; --dim:#9aa6d8;
  --fjp:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Segoe UI",sans-serif;
  --fnum:Consolas,"SF Mono",Menlo,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#030608}
body{font-family:var(--fjp);color:var(--ink);user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;touch-action:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.5}
#vig{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(2,6,8,.55) 100%)}
#redvig{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;transition:opacity .4s;
  background:radial-gradient(ellipse at 50% 50%,transparent 46%,rgba(255,30,20,.34) 100%)}
#redvig.on{opacity:1;animation:redpulse 1s ease-in-out infinite}
@keyframes redpulse{0%,100%{opacity:.55}50%{opacity:1}}
#errtoast{position:absolute;right:12px;bottom:190px;z-index:40;display:none;max-width:min(80vw,420px);
  padding:8px 12px;font-size:11px;line-height:1.6;color:#ffd9d4;background:rgba(70,10,6,.92);
  border:1px solid var(--danger);border-radius:6px;pointer-events:none;font-family:var(--fnum)}
.win{
  border:4px solid transparent;border-radius:9px;
  background:
    linear-gradient(135deg,#000099 0%,#00006e 44%,#000022 100%) padding-box,
    linear-gradient(155deg,#ffffff 0%,#dde3ef 24%,#8e99b0 47%,#59637a 60%,#c8d0e0 82%,#f2f5fc 100%) border-box;
  box-shadow:0 0 0 1px #0a0e1a,inset 0 0 0 1px rgba(0,0,42,.85),inset 0 2px 10px rgba(120,160,255,.09),0 6px 18px rgba(0,0,0,.55);
}
.win-sm{border-width:3px;border-radius:7px;
  box-shadow:0 0 0 1px #0a0e1a,inset 0 0 0 1px rgba(0,0,42,.85),0 3px 10px rgba(0,0,0,.5)}
#ui{position:absolute;inset:0;z-index:10;pointer-events:none}
#ui .hot{pointer-events:auto}
#topbar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:linear-gradient(180deg,rgba(3,8,10,.9),rgba(3,8,10,.45) 75%,transparent)}
#missionchip{font-size:11px;letter-spacing:.14em;color:var(--mako);padding:4px 10px;white-space:nowrap;
  border:1px solid rgba(42,255,158,.35);border-radius:4px;background:rgba(6,40,26,.5);text-shadow:0 0 8px rgba(42,255,158,.6)}
#objective{font-size:12.5px;color:#cfe3d8;letter-spacing:.05em;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .sp{flex:1}
.tbtn{width:36px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#dfe6ff;
  font-size:11px;font-weight:700;transition:transform .08s}
.tbtn:active{transform:scale(.92)}
.tbtn svg{width:18px;height:18px;fill:currentColor}
.tbtn.wide{width:auto;padding:0 9px;font-family:var(--fnum)}
.tbtn.off{color:#6b7392}
#btnSkip{display:none;width:auto;padding:0 12px;color:var(--volt);font-size:12px}
#timerwin{position:absolute;left:50%;top:5px;transform:translateX(-50%);display:none;align-items:baseline;gap:9px;padding:4px 16px 5px}
#timerwin .tl{font-size:10px;letter-spacing:.2em;color:var(--dim)}
#timertxt{font-family:var(--fnum);font-size:25px;font-weight:800;letter-spacing:.08em;color:#fff;text-shadow:0 0 10px rgba(88,216,255,.55);font-variant-numeric:tabular-nums}
#timerwin.warn #timertxt{color:var(--amber)}
#timerwin.crit #timertxt{color:var(--danger);animation:tpulse .5s steps(2) infinite}
@keyframes tpulse{50%{opacity:.55}}
#stagejump{position:absolute;top:54px;left:10px;display:flex;gap:6px}
.chip{padding:4px 9px;font-size:11px;font-weight:700;color:#cfd8ff;cursor:pointer;transition:transform .08s,color .15s}
.chip:hover{color:var(--mako)}
.chip:active{transform:scale(.93)}
.chip.cur{color:var(--mako);text-shadow:0 0 8px rgba(42,255,158,.7)}
#msglog{position:absolute;top:96px;left:10px;width:min(430px,62vw);display:flex;flex-direction:column;gap:5px;transition:top .2s}
body.boss #msglog{top:140px}
.msg{padding:5px 12px;font-size:13px;line-height:1.5;color:#e6ebff;opacity:0;animation:msgin .18s forwards}
.msg.warn{color:var(--amber)}.msg.bad{color:#ff8d84}.msg.good{color:#7dffb8}.msg.sys{color:#a9b8ff}
.msg.fade{transition:opacity .6s;opacity:0!important}
@keyframes msgin{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
#bosshud{position:absolute;top:54px;left:50%;transform:translateX(-50%);width:min(620px,84vw);padding:7px 14px 9px;display:none}
#bosshud .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#bossname{font-size:14px;font-weight:800;letter-spacing:.12em;color:#ffd9d4;text-shadow:0 0 8px rgba(255,74,61,.5)}
#bosshppct{font-family:var(--fnum);font-size:12px;color:var(--dim)}
#bosshpbar{margin-top:5px;height:10px;border-radius:4px;background:#0a0f2e;border:1px solid #39406b;overflow:hidden}
#bosshpfill{height:100%;transform-origin:left;background:linear-gradient(90deg,#ff4a3d,#ff9d2e)}
#stancerow{margin-top:6px;display:flex;align-items:center;gap:8px}
#stancechip{font-size:11.5px;font-weight:800;letter-spacing:.08em;padding:2px 9px;border-radius:4px;background:#12305a;color:#9fb4ff;border:1px solid #39406b}
#stancechip.up{background:#4a2c05;color:var(--amber);border-color:var(--amber);animation:tpulse .4s steps(2) infinite}
#stancewrap{flex:1;height:6px;border-radius:3px;background:#0a0f2e;border:1px solid #39406b;overflow:hidden;opacity:0}
#stancewrap.on{opacity:1}
#stancebar{height:100%;transform-origin:left;background:linear-gradient(90deg,var(--amber),#ff5a3d)}
#targetplate{position:absolute;top:96px;right:12px;display:none;padding:5px 13px;font-size:13px;color:#fff}
body.boss #targetplate{top:140px}
#targetplate b{color:var(--volt)}
#banner{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;pointer-events:none;width:100%}
#banner .bt{display:inline-block;font-size:clamp(24px,4.6vw,50px);font-weight:900;letter-spacing:.14em;padding:4px 26px;animation:bpop .3s cubic-bezier(.2,1.6,.4,1)}
#banner .bs{margin-top:6px;font-size:clamp(12px,1.6vw,17px);font-weight:700;letter-spacing:.1em;color:#ffe9c8;text-shadow:0 2px 4px #000}
@keyframes bpop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
#banner.warning .bt{color:var(--amber);text-shadow:0 0 18px rgba(255,176,32,.8),0 3px 0 #3a2400;
  border-top:5px solid;border-bottom:5px solid;border-image:repeating-linear-gradient(45deg,var(--amber) 0 12px,#141410 12px 24px) 5;
  background:rgba(20,14,2,.75);animation:bpop .3s cubic-bezier(.2,1.6,.4,1),tpulse .6s steps(2) infinite}
#banner.danger .bt{color:#fff;background:rgba(120,10,4,.82);text-shadow:0 0 20px rgba(255,74,61,1);border-radius:6px;border:2px solid var(--danger)}
#banner.chance .bt{color:#0b2b18;background:linear-gradient(180deg,#7dffb8,#2aff9e);border-radius:6px;box-shadow:0 0 26px rgba(42,255,158,.7)}
#banner.gold .bt{background:linear-gradient(180deg,#fff8e0,#ffd94a 45%,#b8862e 60%,#ffe9a0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,217,74,.65)) drop-shadow(0 3px 0 rgba(60,40,0,.9))}
#banner.info .bt{color:var(--cyan);text-shadow:0 0 16px rgba(88,216,255,.8),0 3px 0 #06283a}
#cine{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);width:min(88vw,820px);text-align:center;display:none;
  font-size:clamp(15px,2.3vw,23px);line-height:2;letter-spacing:.12em;color:#d9efe4;text-shadow:0 0 14px rgba(42,255,158,.35),0 2px 4px #000}
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:196px;width:min(92vw,760px);padding:14px 20px 16px;display:none;cursor:pointer}
#dlgname{position:absolute;top:-15px;left:14px;padding:2px 13px;font-size:12.5px;font-weight:800;letter-spacing:.1em}
#dlgtext{font-size:15.5px;line-height:1.85;min-height:3.6em;color:#f0f3ff;letter-spacing:.03em}
#dlgnext{position:absolute;right:14px;bottom:7px;color:#fff;font-size:12px;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:200px;display:none;padding:10px 20px;text-align:center;cursor:pointer;min-width:min(80vw,380px)}
#prompttext{font-size:14.5px;font-weight:700;color:var(--volt);letter-spacing:.06em;text-shadow:0 0 10px rgba(255,233,92,.5)}
#promptbarwrap{display:none;margin-top:8px;height:12px;border-radius:5px;background:#0a0f2e;border:1px solid #39406b;overflow:hidden}
#promptbar{height:100%;transform-origin:left;background:linear-gradient(90deg,var(--mako),#a0ffd8)}
#cmdbar{position:absolute;left:0;right:0;bottom:0;display:none;align-items:flex-end;gap:10px;padding:10px 12px 12px;min-height:172px;
  background:linear-gradient(0deg,rgba(2,5,8,.92) 62%,transparent)}
#cmdwin{width:236px;padding:9px 6px 7px;position:relative;visibility:hidden;flex:none}
#cmdactor{font-size:13.5px;font-weight:800;letter-spacing:.1em;padding:0 10px 5px;color:#fff;border-bottom:1px solid rgba(150,170,255,.25);margin-bottom:4px}
#cmdlist{position:relative;min-height:118px}
.cmdrow{display:flex;justify-content:space-between;align-items:baseline;padding:3px 10px 3px 36px;font-size:15px;letter-spacing:.06em;color:#e8ecff;cursor:pointer;border-radius:4px;line-height:1.5}
.cmdrow .cost{font-size:11.5px;color:#9fb4ff;font-family:var(--fnum)}
.cmdrow.dis{color:#565f86}.cmdrow.dis .cost{color:#565f86}
.cmdrow.sel{background:rgba(120,150,255,.13)}
.cmdrow.limitrow{color:var(--volt);font-weight:800;animation:limflash .45s steps(2) infinite}
.cmdrow.limitrow .cost{color:var(--amber)}
@keyframes limflash{50%{color:#fff;text-shadow:0 0 12px rgba(255,233,92,.9)}}
#cursor{position:absolute;left:7px;top:0;width:27px;height:25px;z-index:2;transition:top .07s ease-out;
  filter:drop-shadow(1px 2px 1px rgba(0,0,0,.65));animation:curbob .55s ease-in-out infinite alternate}
@keyframes curbob{from{transform:translateX(0)}to{transform:translateX(3px)}}
#cmdhint{padding:5px 10px 0;font-size:10px;color:#7f8ab8;border-top:1px solid rgba(150,170,255,.2);margin-top:4px}
.statuswin{flex:1;max-width:360px;padding:8px 12px 9px;position:relative;display:flex;gap:10px;cursor:pointer}
.statuswin.active{box-shadow:0 0 0 1px #0a0e1a,inset 0 0 0 1px rgba(0,0,42,.85),0 0 18px rgba(230,240,255,.55)}
.statuswin.ko{filter:grayscale(.9) brightness(.6)}
.portrait{width:46px;height:46px;flex:none;border-radius:5px;border:1px solid #39406b;background:#050a24}
.stbody{flex:1;min-width:0}
.stname{font-size:13px;font-weight:800;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:baseline}
.stname .lv{font-size:10px;color:var(--dim);font-family:var(--fnum)}
.strow{display:flex;align-items:baseline;gap:5px;font-size:11px;color:var(--dim);margin-top:2px}
.strow b{font-family:var(--fnum);font-size:14.5px;color:#fff;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.strow .mx{font-family:var(--fnum);font-size:10.5px;color:#8a93c0}
.strow.low b{color:var(--danger);animation:tpulse .5s steps(2) infinite}
.microbar{flex:1;height:4px;border-radius:2px;background:#0a0f2e;overflow:hidden;align-self:center}
.microbar i{display:block;height:100%;transform-origin:left}
.hpbar i{background:linear-gradient(90deg,#2fd06e,#8fffb0)}
.mpbar i{background:linear-gradient(90deg,#3f8fe0,#8fd8ff)}
.gauge{display:flex;align-items:center;gap:6px;margin-top:4px}
.gauge label{font-size:8.5px;letter-spacing:.16em;color:#7f8ab8;width:32px;flex:none}
.gtrack{flex:1;height:8px;border-radius:3px;background:#0a0f2e;border:1px solid #39406b;overflow:hidden}
.gfill{height:100%;transform-origin:left}
.atbfill{background:linear-gradient(90deg,#58d8ff,#eafcff)}
.statuswin.ready .atbfill{animation:tpulse .4s steps(2) infinite;background:linear-gradient(90deg,#fff,#a0f0ff)}
.limfill{background:linear-gradient(90deg,#ff9d2e,#ffd94a)}
.statuswin.limfull .limfill{animation:limbar .35s linear infinite alternate}
.statuswin.limfull .gauge.limg label{color:var(--volt);animation:tpulse .35s steps(2) infinite}
@keyframes limbar{from{filter:brightness(1)}to{filter:brightness(2.1)}}
.deficon{position:absolute;top:6px;right:8px;width:16px;height:16px;display:none;color:var(--cyan)}
.statuswin.defending .deficon{display:block}
.mvbtn{position:absolute;bottom:196px;width:66px;height:66px;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;opacity:.92}
.mvbtn svg{width:30px;height:30px;fill:#eaf0ff}
.mvbtn:active{transform:scale(.92)}
#moveL{left:14px}#moveR{right:14px}
body.touch #moveL.on,body.touch #moveR.on{display:flex}
#overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;pointer-events:auto}
#overlay.dim{background:rgba(2,4,12,.62);backdrop-filter:blur(2px)}
.panel{width:min(92vw,560px);padding:20px 24px;max-height:86vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3f57c8 #050a24}
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-track{background:#050a24;border-radius:5px}
.panel::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#5a74e8,#2a3f9e);border-radius:5px;border:1px solid #8fa2ff}
.panel::-webkit-scrollbar-thumb:hover{background:#7a92ff}
.ptitle{font-size:17px;font-weight:900;letter-spacing:.18em;color:#fff;text-align:center;margin-bottom:14px;text-shadow:0 0 12px rgba(120,150,255,.6)}
.orow{position:relative;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 8px 40px;font-size:15.5px;letter-spacing:.06em;color:#e8ecff;cursor:pointer;border-radius:5px;margin:2px 0}
.orow .glov{position:absolute;left:8px;top:50%;width:25px;height:23px;margin-top:-11px;display:none;animation:curbob .55s ease-in-out infinite alternate;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.6))}
.orow.sel{background:rgba(120,150,255,.14)}
.orow.sel .glov{display:block}
.orow .val{color:var(--mako);font-weight:800}
.orow .arr{color:#8a93c0;padding:0 7px;cursor:pointer;font-weight:900}
.orow .arr:hover{color:#fff}
.onote{margin-top:12px;font-size:11px;color:#7f8ab8;text-align:center;line-height:1.8}
.helpsec{margin:10px 0;padding:10px 13px;border:1px solid rgba(120,150,255,.25);border-radius:6px;background:rgba(6,12,40,.5)}
.helpsec h4{font-size:12.5px;color:var(--mako);letter-spacing:.14em;margin-bottom:6px}
.helpsec p{font-size:12.5px;line-height:2;color:#ccd4f5}
kbd{display:inline-block;padding:1px 7px;margin:0 2px;border-radius:4px;background:#101a4a;border:1px solid #4a5aa8;border-bottom-width:3px;font-family:var(--fnum);font-size:11px;color:#fff}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.statcell{padding:9px 12px;border:1px solid rgba(120,150,255,.25);border-radius:6px;background:rgba(6,12,40,.5)}
.statcell .k{font-size:10.5px;color:#8a93c0;letter-spacing:.1em}
.statcell .v{font-family:var(--fnum);font-size:20px;font-weight:800;color:#fff;margin-top:2px}
#rankbox{text-align:center;margin:8px 0 4px}
#rankletter{display:inline-block;font-family:var(--fnum);font-size:74px;font-weight:900;line-height:1;
  background:linear-gradient(180deg,#fff8e0,#ffd94a 45%,#b8862e 65%,#ffe9a0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,217,74,.55));transform:rotate(-5deg);animation:stamp .45s cubic-bezier(.2,2.2,.4,1)}
@keyframes stamp{from{transform:scale(3) rotate(-16deg);opacity:0}to{transform:scale(1) rotate(-5deg);opacity:1}}
#rankmsg{font-size:12.5px;color:#ffe9c8;margin-top:4px}
.gobig{text-align:center;font-size:34px;font-weight:900;letter-spacing:.2em;margin:4px 0 8px}
.gobig.fail{color:var(--danger);text-shadow:0 0 22px rgba(255,74,61,.8)}
.gosub{text-align:center;font-size:13px;color:#c8cfec;margin-bottom:14px;line-height:1.9}
#titlewrap{text-align:center;width:min(94vw,640px)}
#logoFF{font-size:clamp(17px,3vw,26px);font-weight:800;letter-spacing:.5em;text-indent:.5em;color:#e8ecf5;text-shadow:0 2px 0 #565e74,0 0 18px rgba(160,190,255,.4)}
#logoVII{font-family:var(--fnum);font-size:clamp(76px,14vw,132px);font-weight:900;line-height:.95;letter-spacing:.04em;
  background:linear-gradient(175deg,#ffffff 8%,#cdd6e6 30%,#78849c 48%,#f4f7ff 55%,#9aa6bc 72%,#e6ebf5 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(20,26,40,.95)) drop-shadow(0 0 26px rgba(42,255,158,.35));
  animation:shimmer 5s linear infinite;background-size:100% 220%}
@keyframes shimmer{0%{background-position:0 0}50%{background-position:0 100%}100%{background-position:0 0}}
#logosub{margin-top:8px;font-size:clamp(12px,1.9vw,16px);letter-spacing:.34em;text-indent:.34em;color:var(--mako);text-shadow:0 0 14px rgba(42,255,158,.7)}
#logoen{margin-top:4px;font-size:10.5px;letter-spacing:.42em;text-indent:.42em;color:#8a93c0}
#titlemenu{margin:26px auto 0;width:min(88vw,330px);padding:12px 10px;text-align:left}
#titlefoot{margin-top:16px;font-size:10px;color:#5f6a92;line-height:1.9}
#presshint{margin-top:12px;font-size:12px;color:#ffe9c8;letter-spacing:.14em;animation:blink 1.2s steps(2) infinite}
@media (max-width:760px){
  #missionchip{display:none}
  #objective{font-size:11px}
  .chip{padding:4px 7px;font-size:10px}
  #bosshud{top:88px;width:94vw}
  body.boss #msglog{top:172px}
  body.boss #targetplate{top:172px}
  #msglog{width:74vw}
  #cmdbar{min-height:104px;padding:8px 8px 9px}
  #cmdwin{position:absolute;left:8px;bottom:112px;width:206px;padding:7px 4px 5px}
  .cmdrow{font-size:13.5px;padding:2px 8px 2px 32px}
  #cmdlist{min-height:100px}
  #cursor{width:23px;height:21px;left:6px}
  #cmdhint{font-size:9px}
  .statuswin{padding:6px 8px 7px;gap:7px}
  .portrait{width:36px;height:36px}
  .strow b{font-size:13px;min-width:32px}
  .stname{font-size:11.5px}
  #dialog{bottom:118px;padding:11px 14px 13px}
  #dlgtext{font-size:13.5px;min-height:3.2em}
  #prompt{bottom:124px}
  .mvbtn{bottom:120px;width:58px;height:58px}
  #timertxt{font-size:20px}
  #banner{top:26%}
  #errtoast{bottom:118px}
}
@media (max-height:560px){
  #cmdbar{min-height:96px;padding:6px 8px 7px}
  #cmdwin{position:absolute;left:8px;bottom:102px;width:200px;padding:6px 4px 4px}
  .cmdrow{font-size:13px;padding:2px 8px 2px 30px}
  #cmdlist{min-height:96px}
  #cmdhint{display:none}
  .statuswin{padding:5px 8px 6px}
  .portrait{width:32px;height:32px}
  .stname{font-size:11px}
  .strow b{font-size:12.5px}
  .gauge{margin-top:2px}
  .gtrack{height:6px}
  #dialog{bottom:104px;padding:9px 14px 11px}
  #dlgtext{font-size:13px;min-height:2.6em;line-height:1.6}
  #prompt{bottom:108px}
  .mvbtn{bottom:104px;width:52px;height:52px}
  #cine{top:34%}

function addSmoke(x,y,n,big=1){for(let i=0;i<n;i++)FX.parts.push({kind:'smoke',x:x+rnd(-14,14)*big,y:y+rnd(-10,10),vx:rnd(-24,24),vy:rnd(-70,-26),g:-30,t:0,life:rnd(.7,1.5),size:rnd(8,18)*big,col:'90,96,100'});}

function addBolt(x,y0,y1){
 const pts=[],n=9;for(let i=0;i<=n;i++){const t=i/n;pts.push([x+(i>0&&i<n?rnd(-30,30)*(1-t*.3):0),lerp(y0,y1,t)]);}
 const br=[];[3,6].forEach(i=>{const p=pts[i],dir=pick([-1,1]);br.push([p,[p[0]+dir*rnd(20,44),p[1]+rnd(14,30)],[p[0]+dir*rnd(40,80),p[1]+rnd(34,60)]]);});

}
function explosion(x,y,size,tier=0){

function updateFX(dt){
 for(let i=FX.parts.length-1;i>=0;i--){const p=FX.parts[i];p.t+=dt;if(p.t>=p.life){FX.parts.splice(i,1);continue;}p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
 if(FX.parts.length>420)FX.parts.splice(0,FX.parts.length-420);
 ['beams','slashes','bolts','rings','cores'].forEach(k=>{for(let i=FX[k].length-1;i>=0;i--){FX[k][i].t+=dt;if(FX[k][i].t>=FX[k][i].life)FX[k].splice(i,1);}});
 FX.rings.forEach(r=>r.r+=r.vr*dt);
 for(let i=FX.floats.length-1;i>=0;i--){const f=FX.floats[i];f.t+=dt;if(f.t>=f.life){FX.floats.splice(i,1);continue;}

 FX.parts.forEach(p=>{const a=1-p.t/p.life;

function updateDialog(dt){
 if(!G.dlg)return;
 const l=G.dlg.lines[G.dlg.i],len=l.text.length;
 if(G.dlg.ch<len){G.dlg.ch=Math.min(len,G.dlg.ch+dt*30);
  if(Math.floor(G.dlg.ch/3)>G.dlg.lastTick){G.dlg.lastTick=Math.floor(G.dlg.ch/3);AU.typeS();}
  els.dlgtext.textContent=l.text.slice(0,Math.floor(G.dlg.ch));}
}
function advanceDialog(){
 if(!G.dlg)return;
 const l=G.dlg.lines[G.dlg.i];
 if(G.dlg.ch<l.text.length){G.dlg.ch=l.text.length;els.dlgtext.textContent=l.text;AU.pip();return;}
 AU.pop();G.dlg.i++;
 if(G.dlg.i>=G.dlg.lines.length){const cb=G.dlg.onDone;G.dlg=null;els.dialog.style.display='none';if(cb)cb();}
 else{G.dlg.ch=0;G.dlg.lastTick=0;renderDialogName();}
}

function queueBattleTimer(b,fn,delay){
 const start=b.clock;
 const check=()=>{if(G.battle!==b)return;if(b.clock-start>=delay){try{fn();}catch(e){logErr('timerfn',e);}}else battleTimers.push(check);};

class Battle{
 constructor(cfg){
  this.cfg=cfg;this.kind=cfg.kind;this.phase='fight';this.clock=0;this.endT=0;this.endFired=false;this.winFired=false;
  this.queue=[];this.exec=null;this.menu=null;this.firstStance=false;this.weakShown=false;
  this.enemies=cfg.enemies.map((e,i)=>({...e,maxhp:e.hp,flash:0,dead:false,deathT:0,aiT:rnd(2.4,3.4)+i*.8,pose:'idle',ox:0,oy:0,seed:i*2.1,
   rect:null,fire:0,rec:0,tailP:0,stance:'normal',stanceT:0,charge:0,sweep:0,muzzle:0,tip:{x:0,y:0},tipLocal:{x:0,y:0},tilt:0,beamTo:null,
   x:W*.25,y:H*.5,k:1,boss:e.type==='boss'}));
  this.boss=this.enemies.find(e=>e.boss)||null;
  this.patIdx=0;this.motes=[];for(let i=0;i<34;i++)addMote(this.motes,rnd(W),rnd(playTop,playBottom));
  G.party.forEach(p=>{p.pose='idle';p.ox=0;p.oy=0;p.defending=false;p.waitAck=false;p.atb=Math.min(p.atb,60);});
  battleBGKind=cfg.bg;
  this.layout();
  if(this.boss)addMsg('ガードスコーピオンが出現した！','bad');
  else addMsg(cfg.startMsg||'敵が現れた！','warn');
 }
 aliveEnemies(){return this.enemies.filter(e=>!e.dead);}
 aliveParty(){return G.party.filter(p=>!p.ko);}
 layout(){
  const portrait=W/H<.95,gy=playBottom-14;
  const ax=f=>{const aw=Math.min(W,1400);return (W-aw)/2+aw*f;};
  if(this.boss){
   const b=this.boss;
   b.x=ax(portrait?.4:.3);b.y=gy-52;b.k=S*(portrait?.95:1.1);
   G.party[0].x=ax(portrait?.64:.72);G.party[0].y=gy-26;
   G.party[1].x=ax(portrait?.8:.83);G.party[1].y=gy-2;
  }else{
   this.enemies[0].x=ax(portrait?.24:.25);this.enemies[0].y=gy-58;
   this.enemies[1].x=ax(portrait?.38:.34);this.enemies[1].y=gy-12;
   G.party[0].x=ax(portrait?.66:.72);G.party[0].y=gy-26;
   G.party[1].x=ax(portrait?.82:.83);G.party[1].y=gy-2;
  }
  G.party.forEach(p=>p.k=S*.92);
  this.enemies.forEach(e=>{if(!e.boss)e.k=S*.86;});
 }
 update(dt){
  const bdt=dt*G.speedMul;
  this.clock+=bdt;this.layout();
  if(this.exec&&this.clock>=this.exec.deadline)this.completeExec();
  try{this.updateBody(bdt,dt);}catch(err){logErr('battle',err);}
  if(this.exec&&this.clock>this.exec.deadline+1.5)this.completeExec();
 }
 updateBody(bdt,dt){
  this.motes.forEach(m=>{m.t+=dt;m.y+=m.vy*dt;m.x+=Math.sin(m.t+m.sw)*12*dt;if(m.y<playTop){m.y=playBottom;m.x=rnd(W);}});
  this.enemies.forEach(e=>{e.flash=Math.max(0,e.flash-dt*4);e.fire=Math.max(0,e.fire-dt*8);e.rec=Math.max(0,e.rec-dt*6);
   if(e.dead)e.deathT+=dt;
   if(e.boss){e.muzzle=Math.max(0,e.muzzle-dt*10);e.charge=Math.max(0,e.charge-dt*2.5);
    if(e.hp/e.maxhp<.4&&!e.dead&&Math.random()<dt*5)addSmoke(e.x+rnd(-120,120)*e.k,e.y-rnd(60,200)*e.k,1,1.2);
    if(e.dead&&e.deathT<2.2&&Math.random()<dt*9)explosion(e.x+rnd(-150,150)*e.k,e.y-rnd(20,240)*e.k,rnd(14,30),0);
    if(e.dead)e.tilt=Math.min(.14,e.deathT*.08);}});
  G.party.forEach(p=>{p.flash=Math.max(0,p.flash-dt*4);p.hurtT=Math.max(0,p.hurtT-dt);
   if(!p.ko&&this.phase==='fight')p.atb=clamp(p.atb+bdt/p.atbTime*100,0,100);
   if(p.hurtT<=0&&p.pose==='hurt')p.pose='idle';});
  if(this.phase==='fight'){
   if(this.boss&&!this.boss.dead){
    const b=this.boss;
    if(b.stance==='up'){
     b.stanceT-=bdt;
     if(b.stanceT<=0){b.stance='normal';this.queue.push({kind:'lower',actor:b});
      showBanner('チャンス！','しっぽが下がった——今だ、攻撃しろ！','chance',1.7);
      addMsg('ガードスコーピオンのしっぽが下がった……今がチャンスだ！','good');AU.limitS();}
    }else if(!this.exec||this.exec.action.actor!==b){
     b.aiT-=bdt;
     if(b.aiT<=0&&this.queue.length<3){
      const act=D().pattern[this.patIdx%D().pattern.length];this.patIdx++;
      this.queue.push({kind:act,actor:b,target:pick(this.aliveParty())});b.aiT=D().bact;}
    }
   }
   this.enemies.forEach(e=>{
    if(e.boss||e.dead)return;
    e.aiT-=bdt;
    if(e.aiT<=0&&this.queue.length<3){this.queue.push({kind:'shoot',actor:e,target:pick(this.aliveParty()),double:Math.random()<.22});e.aiT=rnd(3,4);}
   });
   if(!this.exec&&this.queue.length){
    let a=this.queue.shift();
    while(a&&a.actor&&(a.actor.dead||a.actor.ko))a=this.queue.shift();
    if(a)this.startExec(a);
   }
   if(!this.menu&&!G.dlg){
    const ready=G.party.find(p=>!p.ko&&p.atb>=100&&!p.waitAck&&!this.exec);
    if(ready)this.openMenu(ready);
   }
   if(this.aliveEnemies().length===0&&!this.exec&&this.queue.length===0)this.beginWin();
   if(this.aliveParty().length===0)this.beginLose();
  }
  if(this.exec)this.stepExec(bdt);
  if(this.phase==='win'){
   this.endT+=dt;
   if(this.endT>.25&&!this.winFired){this.winFired=true;AU.fanfare();
    G.party.forEach(p=>{if(!p.ko)p.pose='win';});
    addMsg('戦闘に勝利した！','good');
    queueBattleTimer(this,()=>addMsg(this.cfg.expMsg||'EXP を獲得した！','sys'),1.2);
    queueBattleTimer(this,()=>G.party.forEach(p=>{if(p.ko){p.ko=false;p.hp=Math.ceil(p.maxhp*.3);p.pose='idle';addMsg(`${p.name}は意識を取り戻した！`,'good');}}),1.6);
   }
   if(this.endT>2.7&&!this.endFired){this.endFired=true;this.cfg.onWin();}
  }
  if(this.phase==='lose'){
   this.endT+=dt;
   if(this.endT>.2&&!this.winFired){this.winFired=true;AU.defeatS();AU.setTrack(null);flash('#5a0a05',.4);}
   if(this.endT>2.1&&!this.endFired){this.endFired=true;showGameOver('wipe');}
  }
 }
 completeExec(){
  const e=this.exec;if(!e)return;const actor=e.action.actor;
  if(actor&&actor.id){actor.pose=actor.defending?'def':'idle';actor.ox=0;actor.oy=0;actor.charge=0;}
  if(actor&&actor.boss){actor.sweep=0;actor.muzzle=0;actor.beamTo=null;}
  this.exec=null;
 }
 beginWin(){this.phase='win';this.endT=0;this.closeMenu();}
 beginLose(){if(this.phase==='lose')return;this.phase='lose';this.endT=0;this.closeMenu();G.party.forEach(p=>p.pose='ko');}
 openMenu(p){this.menu={actor:p,mode:'main',subOrigin:'main',idx:0,rows:[],targetSide:null,targets:[],tIdx:0,pendingCmd:null};this.buildRows();els.cmdwin.style.visibility='visible';AU.pip();}
 closeMenu(){this.menu=null;els.cmdwin.style.visibility='hidden';els.targetplate.style.display='none';}
 buildRows(){
  const m=this.menu,p=m.actor;
  if(m.mode==='main'){
   m.rows=[];
   if(p.limit>=100)m.rows.push({label:'リミット',info:p.limitName,cmd:'limit',limit:true});
   m.rows.push({label:'たたかう',cmd:'fight'},{label:'まほう',cmd:'magic',info:'▶'},{label:'アイテム',cmd:'item',info:'▶'},{label:'ぼうぎょ',cmd:'defend',info:'半減'});
  }else if(m.mode==='magic')m.rows=[{label:'サンダー',info:'4MP',cmd:'thunder',dis:p.mp<4},{label:'ケアル',info:'5MP',cmd:'cure',dis:p.mp<5}];
  else if(m.mode==='item')m.rows=[{label:'ポーション',info:'×'+G.items.potion,cmd:'potion',dis:G.items.potion<=0},{label:'ハイポーション',info:'×'+G.items.hi,cmd:'hi',dis:G.items.hi<=0},{label:'エーテル',info:'×'+G.items.ether,cmd:'ether',dis:G.items.ether<=0}];
  else m.rows=[{label:m.targetSide==='enemy'?'▶ ターゲットを選択':'▶ 回復対象を選択',info:'←→ / クリック',cmd:'none'}];
  m.idx=clamp(m.idx,0,m.rows.length-1);this.renderMenu();
 }
 renderMenu(){
  const m=this.menu;if(!m)return;
  els.cmdactor.textContent=m.actor.name+(m.mode==='target'?' — ターゲット':m.mode==='magic'?' — まほう':m.mode==='item'?' — アイテム':'');
  let html='';
  m.rows.forEach((r,i)=>{html+=`<div class="cmdrow${r.dis?' dis':''}${r.limit?' limitrow':''}${i===m.idx?' sel':''}" data-i="${i}"><span>${r.label}</span><span class="cost">${r.info||''}</span></div>`;});
  els.cmdlist.innerHTML=html;els.cmdlist.appendChild(els.cursor);
  const row=els.cmdlist.querySelector(`.cmdrow[data-i="${m.idx}"]`);
  els.cursor.style.display=m.mode==='target'?'none':'block';
  if(row)els.cursor.style.top=(row.offsetTop+row.offsetHeight/2-12)+'px';
  els.cmdhint.textContent=m.mode==='main'?'↑↓選択 Enter決定 Esc待機':m.mode==='target'?'←→対象 Enter決定 Esc戻る':'↑↓選択 Enter決定 Esc戻る';
  if(m.mode==='target'){const t=m.targets[m.tIdx];els.targetplate.style.display='block';els.targetplate.innerHTML='▶ <b>'+(t?t.name:'')+'</b>';}

function startShatter(next){
 const snap=document.createElement('canvas');snap.width=cv.width;snap.height=cv.height;
 snap.getContext('2d').drawImage(cv,0,0);
 const cols=8,rows=5,cw=W/cols,ch=H/rows,verts=[];
 for(let r=0;r<=rows;r++){verts[r]=[];for(let c2=0;c2<=cols;c2++)
  verts[r][c2]=[c2*cw+(c2>0&&c2<cols?rnd(-cw,cw)*.28:0),r*ch+(r>0&&r<rows?rnd(-ch,ch)*.28:0)];}
 const shards=[];
 for(let r=0;r<rows;r++)for(let c2=0;c2<cols;c2++){
  const q=[verts[r][c2],verts[r][c2+1],verts[r+1][c2+1],verts[r+1][c2]];
  [[q[0],q[1],q[2]],[q[0],q[2],q[3]]].forEach(tri=>{
   const cx=(tri[0][0]+tri[1][0]+tri[2][0])/3,cy=(tri[0][1]+tri[1][1]+tri[2][1])/3;
   shards.push({tri,cx,cy,vx:(cx-W/2)*rnd(1.1,2.1),vy:(cy-H/2)*rnd(1.1,2.1)-rnd(30,120),vr:rnd(-5,5),delay:rnd(.12)});});}
 AU.crack();next();
 G.trans={t:0,dur:.92,shards,snap};flash('#dfe8ff',.22);
}
function drawShatter(c){
 const tr=G.trans;if(!tr)return;
 tr.shards.forEach(s=>{
  const t=Math.max(0,tr.t-s.delay),p=t/(tr.dur-s.delay);if(p>=1)return;
  c.save();c.globalAlpha=1-p;
  c.translate(s.cx+s.vx*t,s.cy+s.vy*t+340*t*t);c.rotate(s.vr*t);
  c.beginPath();c.moveTo(s.tri[0][0]-s.cx,s.tri[0][1]-s.cy);c.lineTo(s.tri[1][0]-s.cx,s.tri[1][1]-s.cy);c.lineTo(s.tri[2][0]-s.cx,s.tri[2][1]-s.cy);c.closePath();c.clip();
  c.drawImage(tr.snap,0,0,tr.snap.width,tr.snap.height,-s.cx,-s.cy,W,H);c.restore();
 });
 c.globalAlpha=1;
}

function jump(n){
 AU.pop();
 if(n===0){freshRun();go('TITLE');return;}
 if(n===1){freshRun();go('CORR',{fresh:true});addMsg('【ステージジャンプ】フェーズ1: 魔晄炉侵入','sys');return;}
 if(n===2){freshRun();go('BOSSINTRO');addMsg('【ステージジャンプ】フェーズ2: ガードスコーピオン戦','sys');return;}
 if(n===3){freshRun(40);setupEscape();go('ESCAPE');addMsg('【ステージジャンプ】フェーズ3: 脱出カウントダウン','sys');}
}
function retryPhase(){
 if(G.state==='BATTLE'&&G.battleFactory){
  G.party=makeParty();G.items={potion:10,hi:2,ether:1};
  const f=G.battleFactory;AU.pop();startBattle(f());return;
 }
 const map={TITLE:0,INTRO:1,CORR:1,BOSSINTRO:2,CORE:3,ESCAPE:3,BOOM:3,CLEAR:3,BATTLE:G.phaseKey};
 jump(map[G.state]!==undefined?map[G.state]:1);
}

function overlayAction(act){
 try{
  switch(act){
   case 'start':AU.pop();freshRun();go('INTRO');break;
   case 'diff':G.diff=(G.diff+1)%3;AU.pip();syncTitleSel();break;
   case 'diff-l':G.diff=(G.diff+2)%3;AU.pip();syncTitleSel();break;
   case 'diff-r':G.diff=(G.diff+1)%3;AU.pip();syncTitleSel();break;
   case 'help':showHelp('title');break;
   case 'help-p':showHelp('pause');break;
   case 'close-help':AU.cancel();hideOverlay();
    if(G.overlayReturn==='title'){showTitle();setPaused(false,true);}
    else if(G.overlayReturn==='pause')showPause();
    else setPaused(false,true);
    break;
   case 'resume':AU.pop();hideOverlay();setPaused(false,true);break;
   case 'retry':hideOverlay();setPaused(false,true);retryPhase();break;
   case 'title':AU.pop();freshRun();go('TITLE');break;
   case 'jump3':hideOverlay();setPaused(false,true);jump(3);break;
  }
 }catch(err){logErr('action',err);}
}

document.addEventListener('keydown',e=>{
 unlockAudio();
 const code=e.code;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter'].includes(code))e.preventDefault();
 if(code==='ShiftLeft'||code==='ShiftRight')G.keys[code]=true;
 if(e.repeat){if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(code))G.keys[code]=true;return;}
 try{
  if(code==='KeyM'){toggleMute();return;}
  if(code==='KeyH'){if(G.overlay==='help')overlayAction('close-help');else showHelp(G.overlay==='pause'?'pause':G.overlay==='title'?'title':null);return;}
  if(G.overlay){
   if(G.overlay==='title'){
    if(code==='ArrowUp'){G.titleSel=(G.titleSel+2)%3;AU.pip();syncTitleSel();}
    else if(code==='ArrowDown'){G.titleSel=(G.titleSel+1)%3;AU.pip();syncTitleSel();}
    else if(code==='ArrowLeft')overlayAction('diff-l');
    else if(code==='ArrowRight')overlayAction('diff-r');
    else if(code==='Enter'||code==='KeyZ')overlayAction(['start','diff','help'][G.titleSel]);
    return;
   }
   if(G.overlay==='help'){if(['Escape','Enter','KeyX'].includes(code))overlayAction('close-help');return;}
   if(G.overlay==='pause'){if(['Escape','KeyP','Enter'].includes(code))overlayAction('resume');return;}
   if(G.overlay==='gameover'||G.overlay==='results'){
    if(code==='Enter'||code==='KeyZ')overlayAction(G.overlay==='gameover'?(G.state==='BOOM'?'jump3':'retry'):'jump3');
    if(code==='Escape')overlayAction('title');
    return;
   }
   return;
  }
  if(code==='KeyP'){if(GAME_STATES.concat('INTRO').includes(G.state))showPause();return;}
  if(code==='KeyR'){retryPhase();return;}
  if(G.dlg){if(['Enter','KeyZ','Space'].includes(code))advanceDialog();return;}
  if(G.state==='BATTLE'&&G.battle){
   const b=G.battle;
   if(b.menu){
    if(code==='ArrowUp'||code==='ArrowLeft')b.nav(-1);
    else if(code==='ArrowDown'||code==='ArrowRight')b.nav(1);
    else if(code==='Enter'||code==='KeyZ')b.confirm();
    else if(code==='Escape'||code==='KeyX')b.cancel();
   }else if(code==='Enter'||code==='KeyZ'){
    const ready=G.party.find(p=>!p.ko&&p.atb>=100);
    if(ready&&b.phase==='fight'){ready.waitAck=false;b.openMenu(ready);}
    else if(b.phase==='win'&&b.endT>1)b.endT=2.65;
   }
   return;
  }
  if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(code))G.keys[code]=true;
  const sc=Scenes[G.state];
  if(['Enter','KeyZ','Space'].includes(code)&&sc&&sc.key)sc.key();
 }catch(err){logErr('key',err);}
});

let lastTs=0;
function frame(ts){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(ts-lastTs)/1000||.016);lastTs=ts;
 try{
  measureUI();computePlayArea();
  if(Math.abs(playBottom-lastReserve)>1){lastReserve=playBottom;rebuildStatics();}
 }catch(err){logErr('layout',err);}
 if(!G.paused){
  G.time+=dt;
  try{
   if(G.escape.on&&(G.state==='ESCAPE'||(G.state==='BATTLE'&&G.battle&&G.battle.cfg.phase===3))&&!G.overlay){
    G.escape.t-=dt;
    const sec=Math.ceil(G.escape.t);
    if(sec!==G.escape.lastSec){G.escape.lastSec=sec;if(sec<=10&&sec>0)AU.beep(sec<=3);}
    if(G.escape.t<=30&&!G.escape.warn30){G.escape.warn30=true;showBanner('残り30秒！！','急げ！出口はまだ先だ！','danger',1.8);AU.alarm();}
    if(G.escape.t<=0){
     G.escape.t=0;
     const snap=document.createElement('canvas');snap.width=cv.width;snap.height=cv.height;
     snap.getContext('2d').drawImage(cv,0,0);
     G.bm0=G.bm1=G.bm2=G.bm3=G.bmDone=false;
     go('BOOM');G.snap=snap;
    }
   }
  }catch(err){logErr('timer',err);}
  if(G.bannerT>0){G.bannerT-=dt;if(G.bannerT<=0)hideBanner();}
  try{updateDialog(dt);}catch(err){logErr('dlg',err);}
  try{const su=Scenes[G.state];if(su&&su.update)su.update(dt);}catch(err){logErr('update',err);}
  try{updateFX(dt);}catch(err){logErr('fx',err);}
  G.shake*=Math.pow(.0012,dt);if(G.shake<.15)G.shake=0;
  G.flashA=Math.max(0,G.flashA-dt*2.6);
  if(G.trans){G.trans.t+=dt;if(G.trans.t>=G.trans.dur)G.trans=null;}
  try{
   if(G.state==='BOSSINTRO'&&G.bossIntroT>4.6)Scenes.BOSSINTRO.finish();
   if(G.trans&&G.trans.t>G.trans.dur+1)G.trans=null;
  }catch(err){logErr('watch',err);}
 }
 try{
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate(rnd(-1,1)*G.shake,rnd(-1,1)*G.shake);
  const sd=Scenes[G.state];
  if(sd&&sd.draw)sd.draw(ctx);
  ctx.restore();
  if(noisePat&&!reduceMotion){ctx.save();ctx.globalAlpha=.5;ctx.translate(rndi(0,160),rndi(0,160));ctx.fillStyle=noisePat;ctx.fillRect(-160,-160,W+320,H+320);ctx.restore();}
  if(G.flashA>0){ctx.fillStyle=G.flashC;ctx.globalAlpha=Math.min(1,G.flashA);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(G.trans)drawShatter(ctx);
  els.game.style.transform=G.shake>10?`translate(${rnd(-1,1)*G.shake*.25}px,${rnd(-1,1)*G.shake*.25}px)`:'';
 }catch(err){logErr('draw',err);}
 try{syncHUD();}catch(err){logErr('hud',err);}
}
/* ---------- init ---------- */
try{G.muted=localStorage.getItem('ff7bm_mute')==='1';}catch(e){}
if(G.muted){els.spkOnEl.style.display='none';els.spkOffEl.style.display='block';els.btnSound.classList.add('off');}
G.party=makeParty();
buildStatus();
sizeAll();
go('TITLE');
requestAnimationFrame(frame);
</script>
</body>
</html>
