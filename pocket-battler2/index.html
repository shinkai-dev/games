<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ポケットモンスター ★ チャンピオンロード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#38b6ff; --sky-deep:#1b6fd8; --sun:#ffd94a; --amber:#ffb703;
  --red:#ff4d5e; --red-deep:#d92c44; --leaf:#4cd97b; --leaf-deep:#2ea75c;
  --aqua:#35d0ff; --fairy:#ff8fd8; --dragon:#8f7bff; --ice:#7fd8e8;
  --ink:#22304f; --ink-deep:#141c33; --cream:#fff6e8; --paper:#fffdf7;
  --cool:#f4f9ff; --scrim:rgba(16,22,44,.62);
  --tN:#b9b3c9; --tF:#ff7a3d; --tW:#3aa7f0; --tG:#4cbf6b; --tE:#ffc93d; --tI:#6fcfe3; --tFa:#ff8fd8; --tD:#8f7bff;
  --rad:18px; --font:'M PLUS Rounded 1c',system-ui,sans-serif; --dot:'DotGothic16',var(--font);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--ink-deep);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:rgba(20,28,51,.35);border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--red),var(--amber));border-radius:8px;border:2px solid rgba(20,28,51,.5)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ff6b7a,var(--sun))}
*{scrollbar-width:thin;scrollbar-color:var(--red) rgba(20,28,51,.35)}

#app{height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0e1530,#1b2a52)}

/* ============ TOP BAR ============ */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:linear-gradient(180deg,#ff5a6e,#e63a52);border-bottom:4px solid var(--ink-deep);
  box-shadow:0 4px 0 rgba(0,0,0,.18),0 8px 22px rgba(0,0,0,.35);position:relative;z-index:60}
#tb-logo{display:flex;align-items:center;gap:8px;font-weight:900;color:#fff;font-size:17px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.25);white-space:nowrap}
#tb-logo .ball-ico{width:26px;height:26px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3));animation:ballspin 9s linear infinite}
@keyframes ballspin{0%,70%{transform:rotate(0)}80%{transform:rotate(-18deg)}90%{transform:rotate(14deg)}100%{transform:rotate(0)}}
#tb-stage{display:flex;align-items:center;gap:5px;margin:0 auto;background:rgba(20,28,51,.35);padding:6px 12px;border-radius:999px;border:2px solid rgba(255,255,255,.35)}
.stage-dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(20,28,51,.4);transition:.3s}
.stage-dot.done{background:var(--sun)}
.stage-dot.cur{background:#fff;transform:scale(1.35);box-shadow:0 0 8px #fff;animation:dotpulse 1.1s ease-in-out infinite}
.stage-dot.alpha{border-color:var(--sun)}
.stage-dot.boss{width:14px;height:14px;border-radius:4px;transform:rotate(45deg)}
.stage-dot.boss.cur{transform:rotate(45deg) scale(1.3)}
@keyframes dotpulse{50%{box-shadow:0 0 14px #fff}}
#tb-stage-label{color:#fff;font-weight:800;font-size:12px;margin-right:4px;display:none}
.tb-btn{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#fff,#ffe9c9);border:3px solid var(--ink-deep);
  border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;color:var(--ink);
  box-shadow:0 3px 0 var(--ink-deep);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
.tb-btn:hover{filter:brightness(1.05)}
.tb-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink-deep)}
.tb-btn svg{width:17px;height:17px;flex:0 0 auto}
.tb-btn.warn{background:linear-gradient(180deg,#ffe08a,var(--amber))}
#btn-sound.off{background:linear-gradient(180deg,#d8dcea,#aab2c8);color:#5a637d}

/* ============ SCREENS ============ */
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ============ TITLE ============ */
#scr-title{overflow:hidden;background:linear-gradient(180deg,#2fa8f5 0%,#5fc6ff 34%,#a8e6ff 62%,#ffe9a8 88%,#ffd166 100%)}
#title-sun{position:absolute;top:7%;right:10%;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#fff8d9,var(--sun) 55%,var(--amber));box-shadow:0 0 60px 22px rgba(255,217,74,.55);animation:sunpulse 5s ease-in-out infinite}
@keyframes sunpulse{50%{box-shadow:0 0 90px 34px rgba(255,217,74,.7)}}
.t-cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92;filter:drop-shadow(0 6px 0 rgba(27,111,216,.12))}
.t-cloud::before,.t-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.t-cloud.c1{width:150px;height:44px;top:14%;animation:cloudmove 70s linear infinite}
.t-cloud.c1::before{width:60px;height:60px;top:-28px;left:24px}.t-cloud.c1::after{width:44px;height:44px;top:-18px;left:78px}
.t-cloud.c2{width:110px;height:34px;top:32%;animation:cloudmove 95s linear infinite;animation-delay:-40s;opacity:.8}
.t-cloud.c2::before{width:44px;height:44px;top:-20px;left:18px}.t-cloud.c2::after{width:34px;height:34px;top:-13px;left:58px}
.t-cloud.c3{width:190px;height:52px;top:6%;animation:cloudmove 120s linear infinite;animation-delay:-70s;opacity:.7}
.t-cloud.c3::before{width:74px;height:74px;top:-34px;left:32px}.t-cloud.c3::after{width:54px;height:54px;top:-22px;left:104px}
@keyframes cloudmove{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 260px))}}
#title-hills{position:absolute;bottom:0;left:0;right:0;height:34%;pointer-events:none}
#title-flyby{position:absolute;top:16%;left:0;width:190px;opacity:.9;pointer-events:none;animation:flyby 16s linear infinite;filter:drop-shadow(0 0 18px rgba(143,123,255,.6))}
@keyframes flyby{0%{transform:translate(-240px,30px) scale(.8)}45%{transform:translate(52vw,-30px) scale(1)}100%{transform:translate(calc(100vw + 260px),20px) scale(.9)}}
#title-mon-layer{position:absolute;inset:0;pointer-events:none}
.title-mon{position:absolute;filter:drop-shadow(0 14px 12px rgba(20,40,90,.28));animation:titlebob 4.5s ease-in-out infinite}
.title-mon svg{width:100%;height:100%}
@keyframes titlebob{50%{transform:translateY(-16px)}}
#title-center{position:relative;z-index:5;margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;text-align:center;max-width:860px}
#logo-arch{display:flex;justify-content:center;line-height:1;margin-bottom:2px;filter:drop-shadow(0 6px 0 rgba(20,28,51,.85)) drop-shadow(0 12px 20px rgba(20,28,51,.4))}
#logo-arch span{font-weight:900;font-size:clamp(34px,7.2vw,72px);
  background:linear-gradient(180deg,#fff3a6 8%,var(--sun) 42%,var(--amber) 78%,#f08c00);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2.5px #1b56c4;paint-order:stroke fill;display:inline-block}
#logo-sub{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,#ff5a6e,var(--red-deep));color:#fff;font-weight:900;
  padding:7px 22px;border-radius:999px;border:3px solid var(--ink-deep);box-shadow:0 4px 0 var(--ink-deep);font-size:clamp(13px,2.4vw,19px);letter-spacing:.14em}
#title-tag{font-weight:800;color:#134a86;background:rgba(255,255,255,.75);padding:8px 18px;border-radius:14px;border:2px solid rgba(27,111,216,.35);font-size:clamp(12px,2vw,15px);line-height:1.7}
#diff-row{display:flex;gap:8px;align-items:center;background:rgba(20,28,51,.28);padding:8px 12px;border-radius:999px}
#diff-row .lbl{color:#fff;font-weight:800;font-size:12px}
.diff-chip{padding:7px 16px;border-radius:999px;border:3px solid var(--ink-deep);font-weight:900;font-size:13px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink-deep);transition:.15s}
.diff-chip.sel{background:linear-gradient(180deg,var(--sun),var(--amber));transform:translateY(2px);box-shadow:0 1px 0 var(--ink-deep)}
.btn-big{display:flex;align-items:center;gap:12px;font-weight:900;font-size:clamp(19px,3.4vw,27px);color:#fff;letter-spacing:.1em;
  background:linear-gradient(180deg,#ff7a6b,var(--red) 55%,var(--red-deep));padding:15px 44px;border-radius:999px;border:4px solid var(--ink-deep);
  box-shadow:0 7px 0 var(--ink-deep),0 16px 30px rgba(217,44,68,.45);transition:transform .1s,box-shadow .1s,filter .2s;animation:startpulse 1.8s ease-in-out infinite}
.btn-big:hover{filter:brightness(1.08)}
.btn-big:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink-deep)}
.btn-big .ball-ico{width:34px;height:34px}
@keyframes startpulse{50%{box-shadow:0 7px 0 var(--ink-deep),0 16px 44px rgba(255,217,74,.75)}}
#title-records{font-weight:800;color:#134a86;font-size:12.5px;background:rgba(255,255,255,.6);padding:5px 14px;border-radius:999px;display:flex;align-items:center;gap:6px}
#title-records svg{width:16px;height:16px}
#title-credit{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:rgba(19,74,134,.75);z-index:5}

/* ============ STARTER ============ */
#scr-starter{background:linear-gradient(180deg,#241f4e 0%,#3a2f7d 40%,#5a4fd0 75%,#8f7bff 100%);overflow:hidden}
#scr-starter::before{content:"";position:absolute;inset:0;background:
  radial-gradient(2px 2px at 12% 20%,#fff,transparent),radial-gradient(2px 2px at 78% 12%,#ffd94a,transparent),
  radial-gradient(1.5px 1.5px at 32% 8%,#fff,transparent),radial-gradient(2px 2px at 60% 26%,#7ffcf0,transparent),
  radial-gradient(1.5px 1.5px at 90% 34%,#fff,transparent),radial-gradient(2px 2px at 22% 42%,#ff8fd8,transparent);
  animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.45}}
#starter-prof{position:relative;z-index:3;margin:16px auto 0;max-width:760px;width:calc(100% - 32px);
  background:var(--cream);border:3px solid var(--ink-deep);border-radius:16px;padding:12px 18px;box-shadow:0 5px 0 var(--ink-deep);
  font-family:var(--dot);font-size:clamp(13px,2vw,16.5px);line-height:1.75;color:var(--ink)}
#starter-prof b{color:var(--red-deep)}
#starter-area{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 12px 16px;min-height:0}
#starter-balls{display:flex;gap:clamp(14px,5vw,64px);align-items:flex-end;justify-content:center}
.pedestal{display:flex;flex-direction:column;align-items:center;gap:6px;transition:.3s;width:clamp(96px,24vw,180px)}
.pedestal .ped-mon{width:100%;aspect-ratio:1;position:relative;transition:.3s}
.pedestal .ped-mon svg{width:100%;height:100%;filter:drop-shadow(0 12px 10px rgba(10,10,40,.45))}
.pedestal .ped-ball{width:62%;margin:0 auto;cursor:pointer;transition:transform .2s;position:relative}
.pedestal .ped-ball svg{width:100%;height:auto;filter:drop-shadow(0 8px 8px rgba(10,10,40,.5))}
.pedestal:not(.open):hover .ped-ball{transform:scale(1.12) rotate(-6deg)}
.pedestal:not(.open) .ped-ball{animation:pedidle 2.6s ease-in-out infinite}
.pedestal:nth-child(2):not(.open) .ped-ball{animation-delay:.4s}
.pedestal:nth-child(3):not(.open) .ped-ball{animation-delay:.8s}
@keyframes pedidle{50%{transform:translateY(-8px)}}
.pedestal .ped-base{width:100%;height:22px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#b9a8ff,#6a5cd0 70%);border:3px solid rgba(20,28,51,.55);box-shadow:0 8px 16px rgba(10,10,40,.4)}
.pedestal .ped-name{font-weight:900;color:#fff;font-size:14px;text-shadow:0 2px 0 rgba(20,28,51,.6);opacity:0;transition:.3s}
.pedestal.open .ped-name{opacity:1}
.pedestal.open .ped-ball{transform:scale(.72);opacity:.85}
.pedestal.dim{opacity:.35;filter:saturate(.4)}
.pedestal .ped-mon{transform:scale(0);opacity:0}
.pedestal.open .ped-mon{transform:scale(1);opacity:1;animation:pedpop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pedpop{0%{transform:scale(0) rotate(-14deg)}100%{transform:scale(1) rotate(0)}}
#starter-info{width:min(680px,94%);background:var(--cream);border:3px solid var(--ink-deep);border-radius:18px;box-shadow:0 6px 0 var(--ink-deep);
  padding:13px 18px;display:none;gap:12px;align-items:center}
#starter-info.show{display:flex;animation:infopop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes infopop{from{transform:translateY(24px);opacity:0}}
#si-left{flex:1;min-width:0}
#si-name{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#si-desc{font-size:13px;font-weight:700;line-height:1.65;margin-top:5px;color:#4a5578}
#si-stats{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.si-stat{font-size:11px;font-weight:800;color:#5a637d;display:flex;align-items:center;gap:5px}
.si-stat .bar{width:56px;height:8px;border-radius:6px;background:#e3e0f0;overflow:hidden;border:1.5px solid rgba(20,28,51,.3)}
.si-stat .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--aqua),var(--dragon))}
#si-right{display:flex;flex-direction:column;gap:8px}
.type-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:900;color:#fff;padding:3px 10px;border-radius:999px;border:2px solid rgba(20,28,51,.55);text-shadow:0 1px 0 rgba(0,0,0,.3);letter-spacing:.05em}
.btn-candy{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;border:3px solid var(--ink-deep);border-radius:14px;
  padding:10px 18px;font-size:15px;box-shadow:0 4px 0 var(--ink-deep);transition:transform .09s,box-shadow .09s,filter .15s;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn-candy:hover{filter:brightness(1.07)}
.btn-candy:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink-deep)}
.btn-candy.red{background:linear-gradient(180deg,#ff7a6b,var(--red-deep))}
.btn-candy.green{background:linear-gradient(180deg,#6fe89a,var(--leaf-deep))}
.btn-candy.blue{background:linear-gradient(180deg,#5fc6ff,var(--sky-deep))}
.btn-candy.yellow{background:linear-gradient(180deg,var(--sun),var(--amber));color:var(--ink);text-shadow:none}
.btn-candy.ghost{background:linear-gradient(180deg,#fff,#e8e4f4);color:var(--ink);text-shadow:none}
.btn-candy:disabled{opacity:.45;filter:saturate(.3);cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink-deep)}

/* ============ BATTLE ============ */
#scr-battle{background:var(--ink-deep)}
#arena{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;border-bottom:4px solid var(--ink-deep);transition:opacity .3s}
#arena.switching{opacity:0}
#arena-world{position:absolute;inset:0;will-change:transform}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--b1,#2fa8f5),var(--b2,#7fd0ff) 55%,var(--b3,#c9ecff))}
#celestial{position:absolute;top:8%;right:12%;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff8d9,var(--sun) 60%,var(--amber));box-shadow:0 0 50px 18px rgba(255,217,74,.5)}
#arena[data-biome="starlake"] #celestial,#arena[data-biome="cosmos"] #celestial,#arena[data-biome="dragonvale"] #celestial{background:radial-gradient(circle at 40% 35%,#fff,#dbe4ff 60%,#aab8f0);box-shadow:0 0 40px 14px rgba(220,230,255,.5);width:72px;height:72px}
#arena[data-biome="cave"] #celestial{opacity:0}
#arena[data-biome="sunset"] #celestial{background:radial-gradient(circle at 40% 35%,#ffe9c9,#ff9a3d 65%,#ff6b3d);box-shadow:0 0 60px 22px rgba(255,140,60,.6);top:26%}
.a-cloud{position:absolute;background:rgba(255,255,255,.9);border-radius:999px;height:30px;width:120px}
.a-cloud::before{content:"";position:absolute;width:46px;height:46px;background:inherit;border-radius:50%;top:-22px;left:20px}
.a-cloud::after{content:"";position:absolute;width:34px;height:34px;background:inherit;border-radius:50%;top:-14px;left:64px}
.a-cloud.k1{top:12%;animation:cloudmove 80s linear infinite}
.a-cloud.k2{top:26%;transform:scale(.7);animation:cloudmove 110s linear infinite;animation-delay:-50s;opacity:.7}
#arena[data-biome="cave"] .a-cloud,#arena[data-biome="cosmos"] .a-cloud,#arena[data-biome="starlake"] .a-cloud,#arena[data-biome="dragonvale"] .a-cloud{opacity:0}
#far-layer,#near-layer{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
#far-layer{height:52%}#near-layer{height:40%}
#far-layer svg,#near-layer svg{position:absolute;bottom:0;left:0;width:100%;height:100%}
#ground{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,var(--g1,#7ddb7a),var(--g2,#3fae52))}
#stars-layer{position:absolute;inset:0;opacity:0;transition:opacity .6s;background:
  radial-gradient(2px 2px at 10% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 25% 30%,#7ffcf0,transparent),
  radial-gradient(2px 2px at 40% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 22%,#ffd94a,transparent),
  radial-gradient(2px 2px at 70% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 18%,#ff8fd8,transparent),
  radial-gradient(2px 2px at 93% 32%,#fff,transparent),radial-gradient(1.5px 1.5px at 15% 45%,#fff,transparent),
  radial-gradient(2px 2px at 65% 40%,#7ffcf0,transparent),radial-gradient(1.5px 1.5px at 35% 38%,#fff,transparent);
  animation:twinkle 3.4s ease-in-out infinite}
#arena[data-biome="starlake"] #stars-layer,#arena[data-biome="cosmos"] #stars-layer,#arena[data-biome="dragonvale"] #stars-layer{opacity:1}
#aurora{position:absolute;inset:-10% -5% 40%;opacity:0;transition:opacity .8s;pointer-events:none;filter:blur(16px)}
#aurora i{position:absolute;left:-10%;right:-10%;height:34%;border-radius:50%;transform:skewY(-6deg)}
#aurora i:nth-child(1){top:8%;background:linear-gradient(90deg,transparent,rgba(127,252,240,.5),rgba(143,123,255,.45),transparent);animation:auroramove 9s ease-in-out infinite alternate}
#aurora i:nth-child(2){top:34%;background:linear-gradient(90deg,transparent,rgba(255,143,216,.4),rgba(53,208,255,.45),transparent);animation:auroramove 12s ease-in-out infinite alternate-reverse}
@keyframes auroramove{from{transform:skewY(-6deg) translateX(-4%)}to{transform:skewY(-4deg) translateX(4%)}}
#arena[data-biome="cosmos"] #aurora,#arena[data-biome="starlake"] #aurora{opacity:1}
.platform{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,var(--p1,#a5ec8f),var(--p2,#4cbf6b) 68%,rgba(0,0,0,.15) 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),0 8px 14px rgba(10,20,50,.22)}
#plat-enemy{width:31%;height:9%;right:7%;top:47%}
#plat-player{width:38%;height:11%;left:4%;bottom:3.5%}
.sprite-slot{position:absolute;display:flex;align-items:flex-end;justify-content:center}
#slot-enemy{right:8.5%;top:9%;width:29%;height:41%}
#slot-player{left:6%;bottom:6.5%;width:35%;height:52%}
.sprite-wrap{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;will-change:transform,filter}
.sprite{width:100%;height:100%;display:flex;align-items:flex-end}
.sprite svg{width:100%;height:100%;overflow:visible}
.sprite.mirror svg{transform:scaleX(-1)}
.mon-float{width:100%;height:100%;display:flex}
.mon-float.floaty{animation:monfloat 3.2s ease-in-out infinite}
@keyframes monfloat{50%{transform:translateY(-9%)}}
.sprite-wrap.enter{animation:spriteenter .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes spriteenter{0%{transform:scale(0) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.sprite-wrap.lunge-r{animation:lungeR .42s ease-out}
.sprite-wrap.lunge-l{animation:lungeL .42s ease-out}
@keyframes lungeR{30%{transform:translate(14%,-6%) scale(1.05)}100%{transform:none}}
@keyframes lungeL{30%{transform:translate(-14%,6%) scale(1.05)}100%{transform:none}}
.sprite-wrap.hurt{animation:hurtshake .42s linear}

<script>
'use strict';
/* ================================================================
   ポケットモンスター ★ チャンピオンロード  —  fan-made original game
   ================================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
let UID=0, EPOCH=0;
const ABORT={abort:true};
const guard=ep=>{if(ep!==EPOCH)throw ABORT;};
const wait=(ms,ep)=>new Promise(r=>setTimeout(r,ms/State.speed)).then(()=>{if(ep!==undefined)guard(ep);});
const PENDING=new Set();
const pend=res=>{const w=v=>{PENDING.delete(w);res(v);};PENDING.add(w);return w;};

/* ---------------- SVG ART HELPERS ---------------- */
const lg=(id,a,b,hor)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${hor?1:0}" y2="${hor?0:1}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const rg=(id,a,b,c)=>`<radialGradient id="${id}" cx=".38" cy=".3" r=".95"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c||b}"/></radialGradient>`;
const blinkDelay=()=>`style="animation-delay:${(-rand(4.6)).toFixed(2)}s"`;
function eye(u,x,y,r,iris,lid,look=-1,mood){
  const lx=x+look*r*.14;
  let brow='';
  if(mood==='cool')brow=`<path d="M${x-r*1.2} ${y-r*1.25} L${x+r*.9} ${y-r*.7}" stroke="#141c33" stroke-width="3.4" stroke-linecap="round"/>`;
  return `<g>
    <ellipse cx="${lx}" cy="${y}" rx="${r}" ry="${r*1.14}" fill="#241f33"/>
    <ellipse cx="${lx}" cy="${y+r*.36}" rx="${r*.62}" ry="${r*.56}" fill="${iris}" opacity=".9"/>
    <circle cx="${lx-r*.32}" cy="${y-r*.38}" r="${r*.34}" fill="#fff"/>
    <circle cx="${lx+r*.3}" cy="${y+r*.22}" r="${r*.15}" fill="#fff" opacity=".9"/>
    <ellipse class="lid" ${blinkDelay()} cx="${lx}" cy="${y-r*1.2}" rx="${r*1.16}" ry="${r*1.24}" fill="${lid}"/>
    ${brow}</g>`;
}
function happyEye(x,y,r,col='#241f33'){return `<path d="M${x-r} ${y+r*.3} Q${x} ${y-r*1.1} ${x+r} ${y+r*.3}" stroke="${col}" stroke-width="${r*.42}" fill="none" stroke-linecap="round"/>`;}
function flameShape(u,x,y,s,rot=0,cls='a-flick',c1='#fff3a6',c2='#ff9a3d',c3='#ff4d2e'){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><g class="${cls}">
    <path d="M0 2 C-11 -6 -12 -20 -4 -30 C-2 -22 3 -22 3 -30 C10 -22 12 -10 7 -2 C4 2 2 3 0 2 Z" fill="${c3}"/>
    <path d="M0 0 C-7 -6 -8 -15 -2 -23 C0 -17 4 -17 4 -22 C8 -15 8 -7 4 -1 C2 1 1 1 0 0 Z" fill="${c2}"/>
    <path d="M0 -2 C-4 -6 -4 -11 -1 -16 C1 -12 3 -12 3 -15 C5 -10 4 -6 2 -2 Z" fill="${c1}"/>
  </g></g>`;
}
const blush=(x,y,r=7)=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.62}" fill="#ff9fb0" opacity=".75"/>`;
const smileW=(x,y,s=1,col='#241f33')=>`<path d="M${x-7*s} ${y} q${3.5*s} ${5*s} ${7*s} 0 q${3.5*s} ${5*s} ${7*s} 0" stroke="${col}" stroke-width="${2.6*s}" fill="none" stroke-linecap="round"/>`;

    AU.delay.connect(fb);fb.connect(AU.delay);const dg=AU.ctx.createGain();dg.gain.value=.3;AU.delay.connect(dg);dg.connect(lp);
    AU.sfx=AU.ctx.createGain();AU.sfx.gain.value=.8;AU.sfx.connect(AU.master);

function tone(o){if(!AU.ctx)return;const t=AU.ctx.currentTime+(o.at||0);
  const osc=AU.ctx.createOscillator(),g=AU.ctx.createGain();osc.type=o.w||'square';
  osc.frequency.setValueAtTime(o.f0,t);if(o.f1)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t+o.d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.v||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+o.d);
  osc.connect(g);g.connect(o.music?AU.music:AU.sfx);if(o.echo&&AU.delay)g.connect(AU.delay);
  osc.start(t);osc.stop(t+o.d+.05);}

function cry(spId){if(!AU.ctx)return;const c=SPECIES[spId].cry;const t=AU.ctx.currentTime;
  const mk=(at,a,b,d)=>{const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type=c.w;
    o.frequency.setValueAtTime(a,t+at);o.frequency.exponentialRampToValueAtTime(Math.max(30,b),t+at+d);
    if(c.pat==='wob'){const l=AU.ctx.createOscillator(),lg2=AU.ctx.createGain();l.frequency.value=11;lg2.gain.value=a*.06;l.connect(lg2);lg2.connect(o.frequency);l.start(t+at);l.stop(t+at+d);}
    g.gain.setValueAtTime(0,t+at);g.gain.linearRampToValueAtTime(.18,t+at+.02);g.gain.exponentialRampToValueAtTime(.001,t+at+d);
    o.connect(g);g.connect(AU.sfx);if(AU.delay)g.connect(AU.delay);o.start(t+at);o.stop(t+at+d+.05);};
  if(c.pat==='up2'){mk(0,c.a,c.b,c.d);mk(c.d+.05,c.b,c.b*1.2,c.d);}
  else if(c.pat==='growl'){mk(0,c.a,c.b,c.d);noise({d:c.d*.8,v:.08,ff:600,at:.02});}

function playSong(key){
  if(!AU.ctx||AU.song===key)return;AU.song=key;
  clearInterval(AU.timer);AU.step=0;AU.nextT=AU.ctx.currentTime+.06;
  const s=SONGS[key];const stepDur=60/s.bpm/2;
  AU.timer=setInterval(()=>{if(!AU.ctx||AU.ctx.state!=='running')return;
    while(AU.nextT<AU.ctx.currentTime+.2){

      if(i%s.hat===1)noise({d:.03,v:.028,ft:'highpass',ff:6000,at});

function loop(t){

  for(let i=FX.tweens.length-1;i>=0;i--){const tw=FX.tweens[i];tw.t+=dt/tw.dur;const p=Math.min(1,tw.t);tw.onU(p);

      let a=clamp(p.life,0,1);if(p.pulse)a*=.4+.6*Math.abs(Math.sin(t/300+p.rot));

      if(p.type==='dot'){c.beginPath();c.arc(p.x,p.y,p.size,0,6.3);c.fill();}
      else if(p.type==='leaf'||p.type==='confetti'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);
        if(p.type==='leaf'){c.beginPath();c.ellipse(0,0,p.size*1.4,p.size*.7,0,0,6.3);c.fill();}
        else c.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);c.restore();}
      else if(p.type==='star'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.beginPath();
        for(let k=0;k<5;k++){const A=k*1.2566-1.5708;c.lineTo(Math.cos(A)*p.size*1.6,Math.sin(A)*p.size*1.6);
          const B=A+.6283;c.lineTo(Math.cos(B)*p.size*.66,Math.sin(B)*p.size*.66);}c.closePath();c.fill();c.restore();}
      else if(p.type==='bubble'){c.lineWidth=1.6;c.beginPath();c.arc(p.x,p.y,p.size,0,6.3);c.stroke();}
      else if(p.type==='ring'){c.lineWidth=3*a;const r=p.size+(1-p.life)*46;c.beginPath();c.arc(p.x,p.y,r,0,6.3);c.stroke();}
      else if(p.type==='slash'){c.lineWidth=4*a;c.lineCap='round';c.save();c.translate(p.x,p.y);c.rotate(p.rot);
        c.beginPath();c.arc(0,0,p.size,-.6,.6);c.stroke();c.restore();}
      else if(p.type==='bolt'){c.lineWidth=p.size*a;c.lineCap='round';c.lineJoin='round';c.beginPath();
        p.pts.forEach((pt,k)=>k?c.lineTo(pt[0],pt[1]):c.moveTo(pt[0],pt[1]));c.stroke();}
    }c.globalAlpha=1;}
  if(FX.shake>.3){FX.shake*=Math.pow(.02,dt);const m=FX.shake;
    $('#arena-world').style.transform=`translate(${rand(-m,m)}px,${rand(-m,m)}px)`;}
  else if(FX.shake!==0){FX.shake=0;$('#arena-world').style.transform='';}
  requestAnimationFrame(loop);
}

function aiPick(){
  const e=B.enemy,a=activeMon();const diff=DIFFS[State.diff];
  const usable=e.moves.filter(mv=>mv.pp>0);
  if(!usable.length)return {id:'struggle',pp:99};
  if(Math.random()>diff.ai)return pick(usable);
  const heal=usable.find(mv=>MOVES[mv.id].heal);
  if(heal&&e.hp/e.maxHp<.32&&chance(.7))return heal;
  const buff=usable.find(mv=>MOVES[mv.id].st&&MOVES[mv.id].st.self);
  if(buff&&e.stages.atk<2&&e.hp/e.maxHp>.6&&chance(.22))return buff;
  const stat=usable.find(mv=>MOVES[mv.id].para===1);
  if(stat&&!a.para&&chance(.3))return stat;
  let best=null,bs=-1;
  for(const mv of usable){const m=MOVES[mv.id];if(!m.pow)continue;
    const sc=m.pow*effOf(m.t,SPECIES[a.sp].t)*(m.t===SPECIES[e.sp].t?1.5:1)*((m.acc||100)/100)*rand(.9,1.1);
    if(sc>bs){bs=sc;best=mv;}}
  return best||pick(usable);
}
async function doMove(user,target,userSide,ep){
  const mvRef=user.moves?user.moves.find(x=>x.id===(user._chosen||'')):null;
  const m=MOVES[user._chosen];const uName=SPECIES[user.sp].n,tName=SPECIES[target.sp].n;
  const tSide=userSide==='player'?'enemy':'player';
  if(user.para&&chance(.25)){SFX.zap();burst(centerOf(slotEl(userSide)).x,centerOf(slotEl(userSide)).y,'E',10);
    await say(`${uName}は しびれて うごけない！`,ep);return;}
  if(mvRef)mvRef.pp=Math.max(0,mvRef.pp-1);
  await say(`${uName}の ${m.n}！`,ep,420);
  if(m.heal){
    const amount=Math.floor(user.maxHp*m.heal);const before=user.hp;user.hp=clamp(user.hp+amount,0,user.maxHp);
    animClass(userSide,'healing',700,ep);SFX.heal();burst(centerOf(slotEl(userSide)).x,centerOf(slotEl(userSide)).y,'heal',16);
    dmgFloat(slotEl(userSide),'+'+(user.hp-before),'heal');updateCards();
    await say(`${uName}の HPが かいふくした！`,ep);return;
  }
  if(m.st){
    SFX.buff();
    for(const who of ['self','foe']){if(!m.st[who])continue;const tgt=who==='self'?user:target;const tgs=who==='self'?userSide:tSide;
      animClass(tgs,'buffing',600,ep);burst(centerOf(slotEl(tgs)).x,centerOf(slotEl(tgs)).y,'star',10);
      for(const k in m.st[who]){const d=m.st[who][k];const before=tgt.stages[k];tgt.stages[k]=clamp(tgt.stages[k]+d,-3,3);
        const real=tgt.stages[k]-before;const kn={atk:'こうげき',def:'ぼうぎょ',spd:'すばやさ'}[k];
        if(real===0){await say(`${SPECIES[tgt.sp].n}の ${kn}は これいじょう ${d>0?'あがらない':'さがらない'}！`,ep);}
        else{SFX.stat(real>0);dmgFloat(slotEl(tgs),(real>0?'▲':'▼')+kn,'stat');
          await say(`${SPECIES[tgt.sp].n}の ${kn}が ${Math.abs(real)>1?'ぐーんと ':''}${real>0?'あがった':'さがった'}！`,ep);}}}
    return;
  }
  if(m.para===1){
    animClass(userSide,userSide==='player'?'lunge-r':'lunge-l',420,ep);SFX.whoosh();
    await wait(240,ep);
    if(!chance((m.acc||100)/100)){SFX.miss();await say(`しかし はずれた！`,ep);return;}
    burst(centerOf(slotEl(tSide)).x,centerOf(slotEl(tSide)).y,'G',14);
    if(target.para){await say(`${tName}は すでに まひしている！`,ep);return;}
    target.para=true;SFX.zap();updateCards();animClass(tSide,'hurt',420,ep);
    await say(`${tName}は まひして わざが でにくくなった！`,ep);return;
  }
  const hits=m.multi?irand(m.multi[0],m.multi[1]):1;
  let totalDmg=0,hitCount=0;
  for(let h=0;h<hits;h++){
    if(target.hp<=0)break;
    if(m.r==='melee'){animClass(userSide,userSide==='player'?'lunge-r':'lunge-l',420,ep);SFX.whoosh();await wait(220,ep);}
    else{
      const from=centerOf(slotEl(userSide)),to=centerOf(slotEl(tSide));
      SFX.whoosh();
      if(m.t==='E'){boltFX(from.x,from.y-20,to.x,to.y);SFX.zap();await wait(200,ep);}
      else await projectile(from,to,m.t,m.big);
      guard(ep);
    }
    if(!chance((m.acc||100)/100)){SFX.miss();dmgFloat(slotEl(tSide),'MISS','nve');await say(`しかし はずれた！`,ep);continue;}
    const eff=effOf(m.t,SPECIES[target.sp].t);
    const stab=m.t===SPECIES[user.sp].t?1.5:1;
    const crit=chance(m.crit||.0625);
    const A=statOf(user,'atk'),D=statOf(target,'def');
    let dmg=Math.floor((((2*user.lv/5+2)*m.pow*A/D)/25+2)*eff*stab*rand(.85,1)*(crit?1.5:1));
    dmg=Math.max(1,dmg);target.hp=Math.max(0,target.hp-dmg);totalDmg+=dmg;hitCount++;
    const tc=centerOf(slotEl(tSide));
    burst(tc.x,tc.y,m.t,eff>1?26:16,eff>1||m.big);slashFX(tc.x,tc.y,crit?'#ffd94a':'#fff');
    if(m.big){flash();shake(16);}else shake(crit?13:eff>1?11:6);
    SFX.hit(eff);animClass(tSide,'hurt',430,ep);
    dmgFloat(slotEl(tSide),'-'+dmg,(eff>1?'se ':'')+(eff<1?'nve ':'')+(crit?'crit':''));
    updateCards();
    if(crit)await say(`きゅうしょに あたった！`,ep,420);
    if(eff>1)await say(`こうかは ばつぐんだ！`,ep,420);
    else if(eff<1)await say(`こうかは いまひとつの ようだ…`,ep,420);
    if(target.hp<=0)break;
    if(m.para&&chance(m.para)&&!target.para){target.para=true;SFX.zap();updateCards();await say(`${tName}は まひした！`,ep);}
    if(m.spdDown&&chance(m.spdDown)&&target.stages.spd>-3){target.stages.spd--;SFX.stat(false);dmgFloat(slotEl(tSide),'▼すばやさ','stat');await say(`${tName}の すばやさが さがった！`,ep);}
  }
  if(hitCount>1)await say(`${hitCount}かい あたった！`,ep,380);
  if(m.drain&&totalDmg>0){const heal=Math.max(1,Math.floor(totalDmg*m.drain));const b4=user.hp;user.hp=clamp(user.hp+heal,0,user.maxHp);
    SFX.heal();burst(centerOf(slotEl(userSide)).x,centerOf(slotEl(userSide)).y,'heal',12);dmgFloat(slotEl(userSide),'+'+(user.hp-b4),'heal');updateCards();
    await say(`${uName}は たいりょくを すいとった！`,ep);}
  if(m.recoil&&totalDmg>0){const rec=Math.max(1,Math.floor(totalDmg*m.recoil));user.hp=Math.max(1,user.hp-rec);
    animClass(userSide,'hurt',420,ep);dmgFloat(slotEl(userSide),'-'+rec,'nve');updateCards();
    await say(`${uName}は はんどうで ダメージを うけた！`,ep);}
  if(m.selfSt&&hitCount>0){for(const k in m.selfSt){user.stages[k]=clamp(user.stages[k]+m.selfSt[k],-3,3);SFX.stat(false);
    dmgFloat(slotEl(userSide),'▼こうげき','stat');await say(`${uName}の こうげきが がくんと さがった！`,ep);}}
}

async function handleFaints(ep){
  if(B.enemy&&B.enemy.hp<=0){
    const e=B.enemy;SFX.faint();await animClass('enemy','fainting',650,ep);
    await say(`${B.kind==='trainer'?'あいての ':''}${SPECIES[e.sp].n}は たおれた！`,ep);
    slotEl('enemy').innerHTML='';
    const base=Math.floor(SPECIES[e.sp].xp*e.lv/5*(e.alpha?1.6:1)*(B.kind==='trainer'?1.35:1));
    const a=activeMon();
    if(a&&a.hp>0)await grantXp(a,base,ep);
    for(let i=0;i<State.party.length;i++){const pm=State.party[i];if(i!==State.lead&&pm.hp>0)grantXp(pm,Math.floor(base*.35),ep,false);}
    B.enemyIdx++;

      await sendOutEnemy(ep);return 'continue-turn-end';

async function battleTurn(choice,ep){
  menuIdle();

  if(choice.act==='ball'){await captureFlow(ep);return;}
  if(choice.act==='run'){
    SFX.whoosh();

    await say(`にげられない！`,ep);await enemyAttack(ep);return;
  }

    SFX.heal();animClass('player','healing',700,ep);burst(centerOf($('#slot-player')).x,centerOf($('#slot-player')).y,'heal',16);

    slotEl('player').innerHTML='';State.lead=idx;resetStages(activeMon());
    await sendOutPlayer(ep);await enemyAttack(ep);return;
  }
  if(choice.moveIdx!==undefined){
    const mv=choice.moveIdx===-1?{id:'struggle'}:a.moves[choice.moveIdx];
    a._chosen=mv.id;
    const e=B.enemy;
    const pSpd=statOf(a,'spd'),eSpd=statOf(e,'spd');
    const playerFirst=pSpd===eSpd?chance(.5):pSpd>eSpd;

      if(side==='enemy')B.enemy._chosen=aiPick().id;
      await doMove(user,target,side,ep);
      const r=await handleFaints(ep);
      if(r==='battle-over')break;
      if(r==='continue-turn-end')break;
    }
  }
}
async function battleLoop(ep){

  GAUGE.active=false;const d=Math.abs(GAUGE.pos-.5);
  let mult,label,cls;
  if(d<=.07){mult=1.5;label='PERFECT！！';cls='perfect';SFX.catch();}
  else if(d<=.18){mult=1.2;label='グッド！';cls='good';SFX.confirm();}
  else if(d<=.32){mult=1;label='ナイススロー';cls='';SFX.blip();}
  else{mult=.75;label='うーん…';cls='';SFX.back();}
  const r=$('#gauge-result');r.textContent=label;r.className=cls;
  const res=GAUGE.resolve;GAUGE.resolve=null;
  setTimeout(()=>{$('#gauge').classList.remove('show');GAUGE=null;res({mult,label});},520);
}
function gaugeCancel(){if(!GAUGE||!GAUGE.active)return;GAUGE.active=false;const res=GAUGE.resolve;GAUGE=null;$('#gauge').classList.remove('show');SFX.back();res(null);}
$('#btn-throw').addEventListener('click',gaugeThrow);
$('#gauge-card').addEventListener('click',e=>{if(e.target.closest('button'))return;gaugeThrow();});
$('#btn-gauge-cancel').addEventListener('click',gaugeCancel);
async function captureFlow(ep){
  const g=await throwGauge(ep);
  if(!g){return;}
  State.items.ball--;renderDrawer();
  await say(`モンスターボールを なげた！`,ep,380);
  const e=B.enemy;const eWrap=wrapEl('enemy');
  const ball=$('#ball-anim');ball.innerHTML=ballSVG('ba'+(++UID));ball.style.display='block';
  const from=centerOf($('#slot-player')),to=centerOf($('#slot-enemy'));
  const arenaR=$('#arena').getBoundingClientRect();
  SFX.whoosh();
  await tween(.6,t=>{const x=from.x+(to.x-from.x)*t,y=from.y+(to.y-from.y)*t-Math.sin(t*Math.PI)*120;
    ball.style.left=(x-26)+'px';ball.style.top=(y-26)+'px';ball.style.transform=`rotate(${t*540}deg)`;});
  guard(ep);
  if(g.mult>=1.2)toast(g.label,'star');
  if(eWrap)eWrap.classList.add('sucked');SFX.whoosh();
  await wait(480,ep);
  slotEl('enemy').innerHTML='';
  const groundY=arenaR.height*.5;
  await tween(.35,t=>{ball.style.top=(to.y-26+(groundY-to.y)*t*t)+'px';ball.style.transform='';});
  guard(ep);SFX.thud();
  const hpF=e.hp/e.maxHp;
  let c=SPECIES[e.sp].catch*(1.15-.85*hpF)*g.mult*DIFFS[State.diff].cap*(e.alpha?.6:1);
  c=clamp(c,.04,.92);
  const success=chance(c);
  const shakes=success?3:(c>.5?2:c>.25?irand(1,2):irand(0,1));
  for(let i=0;i<shakes;i++){
    await wait(430,ep);ball.classList.remove('shake');void ball.offsetWidth;ball.classList.add('shake');SFX.thud();
    await wait(600,ep);
  }
  await wait(420,ep);
  if(success){
    SFX.catch();flash();
    burst(to.x,groundY,'star',30,true);
    ball.style.display='none';
    await say(`やった！ ${SPECIES[e.sp].n}を つかまえた！`,ep);
    catchMon(e.sp);State.captures++;META.captures++;saveMeta();
    toast(`ずかんに とうろくした！`,'ball');
    const nm=makeMon(e.sp,e.lv,e.alpha);nm.hp=Math.max(1,e.hp);
    if(State.party.length<6){State.party.push(nm);toast(`${SPECIES[e.sp].n}が なかまに なった！`);}
    else{State.box.push(nm);toast(`${SPECIES[e.sp].n}は ボックスへ おくられた！`,'ball');}
    const a=activeMon();
    if(a&&a.hp>0)await grantXp(a,Math.floor(SPECIES[e.sp].xp*e.lv/5*.5),ep);
    B.over=true;
    await interlude(ep,{captured:true});
  }else{
    SFX.breakout();burst(to.x,groundY,'N',18);
    ball.style.display='none';
    const w=mountSprite($('#slot-enemy'),e,false);w.classList.add('enter');cry(e.sp);
    await wait(400,ep);w.classList.remove('enter');
    await say(`ああっ！ ${SPECIES[e.sp].n}が でてきちゃった！`,ep);
    await enemyAttack(ep);
  }
}
/* ---------------- EVOLUTION ---------------- */
async function evolveScene(m,ep){
  const oldSp=m.sp,newSp=SPECIES[oldSp].ev;
  const ov=$('#evolve'),stage=$('#evolve-stage');
  ov.classList.add('show');$('#btn-evolve-ok').classList.remove('show');
  stage.className='silhouette';stage.innerHTML=monArt(oldSp);
  $('#evolve-text').textContent=`おや…？ ${SPECIES[oldSp].n}の ようすが…！`;
  SFX.evolve();
  await wait(2500,ep);
  flash();
  m.sp=newSp;m.moves=SPECIES[newSp].moves.map(id=>({id,pp:MOVES[id].pp}));
  recalcStats(m);m.hp=m.maxHp;
  seeMon(newSp);catchMon(newSp);
  stage.className='reveal';stage.innerHTML=monArt(newSp);
  cry(newSp);SFX.catch();
  $('#evolve-text').innerHTML=`おめでとう！ ${SPECIES[oldSp].n}は<br>${SPECIES[newSp].n}に しんかした！`;
  $('#btn-evolve-ok').classList.add('show');
  updateCards();renderDrawer();
  await new Promise(r=>{
    const rw=pend(r);
    const done=()=>{$('#btn-evolve-ok').removeEventListener('click',onClick);clearTimeout(tm);rw();};
    const onClick=()=>{SFX.confirm();done();};
    const tm=setTimeout(done,3400/State.speed);
    $('#btn-evolve-ok').addEventListener('click',onClick);
  }).then(()=>guard(ep));
  ov.classList.remove('show');
  toast(`${SPECIES[newSp].n}の ずかんデータも こうしん！`,'star');
}
async function runEvolutions(ep){
  for(const m of State.party){
    while(SPECIES[m.sp].ev&&m.lv>=8){await evolveScene(m,ep);}
  }
}
/* ---------------- STAGE FLOW ---------------- */
async function winBattle(ep){
  State.wins++;
  const stage=STAGES[B.stageIdx];
  if(B.kind==='trainer'){
    await say(`${B.trainer.name}を たおした！`,ep);
  }
  const rw={ball:2,potion:1,revive:0};
  if(stage.kind==='alpha'){rw.ball=3;rw.potion=2;rw.revive=1;}
  if(stage.kind==='trainer'){rw.ball=3;rw.revive=1;}
  if(State.diff==='easy')rw.potion++;
  State.items.ball+=rw.ball;State.items.potion+=rw.potion;State.items.revive+=rw.revive;
  SFX.confirm();
  toast(`ボール +${rw.ball} ／ きずぐすり +${rw.potion}${rw.revive?' ／ げんきのかけら +1':''}`,'ball');
  await say(`ほうしゅうを てにいれた！`,ep,500);
  await runEvolutions(ep);
  if(B.stageIdx>=STAGES.length-1){await victory(ep);return;}
  await interlude(ep,{rewards:rw});
}
async function loseBattle(ep){
  await say(`めのまえが まっくらに なった…`,ep,1200);
  SFX.lose();
  showEnd(false);
}
async function interlude(ep,{ran=false,captured=false,rewards=null}={}){
  playSong('calm');
  for(const m of State.party){m.moves.forEach(mv=>mv.pp=MOVES[mv.id].pp);resetStages(m);
    if(m.hp>0&&m.hp<m.maxHp)m.hp=clamp(m.hp+Math.ceil(m.maxHp*.2),0,m.maxHp);}
  if(B.enemy)resetStages(B.enemy);
  const nextIdx=ran?B.stageIdx:B.stageIdx+1;
  const next=STAGES[nextIdx];
  const cur=STAGES[B.stageIdx];
  const center=next.center;
  const stampText=ran?'にげきった！':captured?'つかまえた！':'ステージ クリア！';
  const kindLabel={wild:'やせい',alpha:'アルファ',trainer:'トレーナー'}[next.kind];
  let previewMons='';
  if(next.kind==='trainer'){previewMons=`<div class="nxm av">${trainerArt(next.trainer.avatar)}</div>`;}
  else{const uniq=[...new Set(next.pool.map(p=>p[0]))].slice(0,4);previewMons=uniq.map(id=>`<div class="nxm">${monArt(id)}</div>`).join('');}
  const rwHtml=rewards?`<div class="int-rewards">
    <span class="int-rw" style="animation-delay:.05s">${ICON.ball}ボール +${rewards.ball}</span>
    <span class="int-rw" style="animation-delay:.15s">${ICON.potion}きずぐすり +${rewards.potion}</span>
    ${rewards.revive?`<span class="int-rw" style="animation-delay:.25s">${ICON.revive}げんきのかけら +1</span>`:''}
    <span class="int-rw" style="animation-delay:.35s">${ICON.star}キャンプで HP+20%・PPかいふく</span></div>`:
    captured?`<div class="int-rewards"><span class="int-rw">${ICON.star}キャンプで HP+20%・PPかいふく</span><span class="int-rw" style="animation-delay:.1s">${ICON.ball}ずかん ${State.caught.size}/15</span></div>`:
    `<div class="int-rewards"><span class="int-rw">${ICON.run}ほうしゅうは なし…でも つぎは ちがう コに あえるかも</span></div>`;
  $('#int-card').innerHTML=`
    <div id="int-clear"><span id="int-stamp" style="${ran?'background:linear-gradient(180deg,#5fc6ff,#1b6fa8)':captured?'background:linear-gradient(180deg,#ffd94a,#ffb703);color:#22304f':''}">${stampText}</span>
    <span id="int-sub">STAGE ${B.stageIdx+1}「${cur.name}」</span></div>
    ${rwHtml}
    <div id="int-party">${State.party.map(m=>`<div class="int-pmini ${m.hp<=0?'fainted':''}"><div class="pm-mon">${monArt(m.sp)}</div><div><b>${SPECIES[m.sp].n} Lv${m.lv}</b><div class="pm-hp"><i style="width:${m.hp/m.maxHp*100}%"></i></div></div></div>`).join('')}</div>
    <div id="int-next"><span class="nx-lbl">つぎの ステージ ${nextIdx+1}/10</span>
      <div class="nx-name">${next.name} <span class="nx-kind ${next.kind}">${kindLabel}</span></div>
      <div class="nx-mons">${previewMons}</div>
      <div class="nx-hint">${center?'モンスターセンターが ある！ぜんかいふく してから いどもう。':next.kind==='alpha'?'アルファは つよい！HPを へらしてから ボールを ねらおう。':next.kind==='trainer'?'トレーナーせん！ボールは なげられない・にげられない！':'やせいの モンスターが でてくるよ。つかまえる チャンス！'}</div></div>
    <div id="int-btns"><button class="btn-candy red" id="int-go">つぎへ すすむ →</button><button class="btn-candy blue" id="int-party-btn">パーティを ととのえる</button></div>`;
  $('#interlude').classList.add('show');
  updateCards();renderDrawer();
  await new Promise(r=>{
    const rw2=pend(r);
    const done=v=>{$('#int-go').removeEventListener('click',go);$('#int-party-btn').removeEventListener('click',pb);rw2(v);};
    const go=()=>{SFX.confirm();done('go');};
    const pb=()=>{SFX.confirm();openDrawer();};
    $('#int-go').addEventListener('click',go);
    $('#int-party-btn').addEventListener('click',pb);
  }).then(v=>{guard(ep);if(v&&v.abort)throw ABORT;return v;});
  closeDrawer();
  $('#interlude').classList.remove('show');
  await battleScript(nextIdx,ep);
}
async function vsSplash(trainer,ep){
  $('#vs-left').innerHTML=`<div class="vs-mon">${monArt(activeMon().sp)}</div><div class="vs-name">${SPECIES[activeMon().sp].n} Lv${activeMon().lv}</div>`;
  $('#vs-right').innerHTML=`<div class="vs-mon">${trainerArt(trainer.avatar)}</div><div class="vs-name">${trainer.name}</div>`;
  $('#vs').classList.add('show');SFX.vs();
  await wait(1700,ep);
  $('#vs').classList.remove('show');
}
async function battleScript(idx,parentEp){
  const ep=parentEp!==undefined?parentEp:EPOCH;
  guard(ep);
  try{
    setScreen('battle');
    B.stageIdx=idx;State.stage=idx;B.over=false;B.enemyIdx=0;
    const stage=STAGES[idx];B.kind=stage.kind;B.trainer=stage.trainer||null;
    renderStageDots();
    const arena=$('#arena');arena.classList.add('switching');
    await wait(300,ep);
    applyBiome(stage.biome);
    arena.classList.toggle('bossfight',(stage.kind==='trainer'&&idx===9)||stage.kind==='alpha');
    fxResize();
    arena.classList.remove('switching');
    playSong(stage.kind==='trainer'?'boss':'battle');
    if(stage.center){
      for(const m of State.party){m.hp=m.maxHp;m.moves.forEach(mv=>mv.pp=MOVES[mv.id].pp);resetStages(m);}
      SFX.heal();toast('モンスターセンターで ぜんかいふく！','potion');
    }
    for(const m of State.party){m.moves.forEach(mv=>mv.pp=MOVES[mv.id].pp);resetStages(m);}
    if(activeMon().hp<=0){const alive=State.party.findIndex(m=>m.hp>0);if(alive>=0)State.lead=alive;}
    B.enemyTeam=buildEnemyTeam(stage);B.enemy=B.enemyTeam[0];resetStages(B.enemy);
    slotEl('enemy').innerHTML='';slotEl('player').innerHTML='';
    updateCards();
    await say(`ステージ${idx+1}「${stage.name}」に とうちゃく！`,ep);
    if(idx===0)await say(`10の ステージを かけぬけて チャンピオンを たおそう！`,ep);
    await sendOutPlayer(ep,idx!==0);
    if(stage.kind==='trainer'){
      await vsSplash(B.trainer,ep);
      await say(`${B.trainer.name}が しょうぶを しかけてきた！`,ep);
      await say(`「${B.trainer.line}」`,ep);
    }
    await sendOutEnemy(ep);
    await battleLoop(ep);
  }catch(e){if(!e||!e.abort)console.error(e);}
}
/* ---------------- END SCREENS ---------------- */
function fmtTime(ms){return `${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;}
async function victory(ep){
  playSong('calm');SFX.fanfare();FX.confetti=true;
  META.clears++;const t=Date.now()-State.runStart;
  if(!META.bestMs||t<META.bestMs)META.bestMs=t;saveMeta();
  await say(`チャンピオン・ルナを たおした！ きみが あたらしい チャンピオンだ！`,ep,1400);
  const gift=makeMon('kokuuryu',stageLv(16));
  if(State.party.length<6)State.party.push(gift);else State.box.push(gift);
  catchMon('kokuuryu');
  SFX.catch();
  const maxLv=Math.max(...State.party.map(m=>m.lv));
  $('#endscreen').classList.remove('lose');
  $('#end-card').innerHTML=`
    <div id="end-title">★ CHAMPION ★</div>
    <div id="end-sub">おめでとう！きみは でんせつを こえた！<br>ぼうけんは おわる——でも ずかんの たびは つづく！</div>
    <div id="end-mon">${monArt('kokuuryu')}</div>
    <div id="end-gift">${ICON.crown} ルナ「この コを あなたに あずけよう」<br><b>コクウリュウ Lv${gift.lv}</b>が なかまに なった！（${State.party.includes(gift)?'パーティ':'ボックス'}に はいったよ）</div>
    <div id="end-stats">
      <div class="end-stat"><div class="es-l">クリアタイム</div><div class="es-v">${fmtTime(t)}</div></div>
      <div class="end-stat"><div class="es-l">しょうり</div><div class="es-v">${State.wins}</div></div>
      <div class="end-stat"><div class="es-l">つかまえた</div><div class="es-v">${State.captures}</div></div>
      <div class="end-stat"><div class="es-l">さいこうLv</div><div class="es-v">${maxLv}</div></div>
      <div class="end-stat"><div class="es-l">ずかん</div><div class="es-v">${State.caught.size}/15</div></div>
    </div>
    <div id="end-btns"><button class="btn-candy red" id="end-again">もう一度 あそぶ</button><button class="btn-candy blue" id="end-dex">ずかんを みる</button><button class="btn-candy ghost" id="end-title-btn">タイトルへ</button></div>`;
  $('#endscreen').classList.add('show');
  cry('kokuuryu');
  $('#end-again').addEventListener('click',()=>{SFX.confirm();newRun();});
  $('#end-dex').addEventListener('click',()=>{drawerTab='dex';$$('.dtab').forEach(x=>x.classList.toggle('sel',x.dataset.t==='dex'));openDrawer();});
  $('#end-title-btn').addEventListener('click',()=>{SFX.confirm();toTitle();});
}
function showEnd(win){
  playSong('calm');FX.confetti=false;
  const t=Date.now()-State.runStart;
  $('#endscreen').classList.add('lose');
  $('#end-card').innerHTML=`
    <div id="end-title">GAME OVER</div>
    <div id="end-sub">めのまえが まっくらに なった…<br>でも きみと モンスターの きずなは きえていない！</div>
    <div id="end-stats">
      <div class="end-stat"><div class="es-l">とうたつ</div><div class="es-v">STAGE ${State.stage+1}</div></div>
      <div class="end-stat"><div class="es-l">しょうり</div><div class="es-v">${State.wins}</div></div>
      <div class="end-stat"><div class="es-l">つかまえた</div><div class="es-v">${State.captures}</div></div>
      <div class="end-stat"><div class="es-l">じかん</div><div class="es-v">${fmtTime(t)}</div></div>
    </div>
    <div id="end-btns"><button class="btn-candy yellow" id="end-retry">このステージに リベンジ！</button><button class="btn-candy red" id="end-again">さいしょから</button><button class="btn-candy ghost" id="end-title-btn">タイトルへ</button></div>
    <p style="color:#aab2c8;font-size:12px;font-weight:700;margin-top:14px">リベンジ：パーティ ぜんかいふく＋ボール +2 で おなじステージに ちょうせん！</p>`;
  $('#endscreen').classList.add('show');
  $('#end-retry').addEventListener('click',()=>{SFX.confirm();
    for(const m of State.party){m.hp=m.maxHp;m.moves.forEach(mv=>mv.pp=MOVES[mv.id].pp);resetStages(m);}
    State.items.ball+=2;
    $('#endscreen').classList.remove('show');
    battleScript(State.stage).catch(err=>{if(!err||!err.abort)console.error(err);});
  });
  $('#end-again').addEventListener('click',()=>{SFX.confirm();newRun();});
  $('#end-title-btn').addEventListener('click',()=>{SFX.confirm();toTitle();});
}
/* ---------------- RUN MANAGEMENT ---------------- */
function cleanupOverlays(){
  abortAllPending();
  MSG.resolve=null;clearInterval(MSG.typer);clearTimeout(MSG.timer);
  ACT=null;GAUGE=null;MODAL.resolve=null;MODAL.lock=false;
  $('#modal').classList.remove('show');$('#gauge').classList.remove('show');
  $('#evolve').classList.remove('show');$('#vs').classList.remove('show');
  $('#interlude').classList.remove('show');$('#endscreen').classList.remove('show');
  closeDrawer();menuIdle();$('#msg-text').textContent='';$('#msg-arrow').classList.remove('show');
  $('#ball-anim').style.display='none';FX.parts.length=0;FX.tweens.forEach(t=>t.res());FX.tweens.length=0;FX.confetti=false;FX.shake=0;
  $('#arena-world').style.transform='';
}
function newRun(){EPOCH++;cleanupOverlays();playSong('calm');setScreen('starter');renderStarter();}
function toTitle(){EPOCH++;cleanupOverlays();playSong('title');setScreen('title');renderTitle();}
$('#btn-restart').addEventListener('click',async()=>{
  SFX.blip();
  if(State.screen==='title')return;
  const ok=await confirmModal('ぼうけんを さいしょから やりなおす？<br>いまの パーティと ずかんデータは リセットされるよ。');
  if(ok===true)toTitle();
});
$('#btn-speed').addEventListener('click',()=>{State.speed=State.speed===1?2:1;saveSet();$('#speed-lbl').textContent='×'+State.speed;SFX.blip();toast(`バトルスピード ×${State.speed}`);});
$('#btn-sound').addEventListener('click',()=>{auInit();auResume();setSound(!State.sound);if(State.sound)SFX.confirm();});
/* ---------------- KEYBOARD ---------------- */
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key;
  if(k==='Escape'){
    if(GAUGE&&GAUGE.active){gaugeCancel();e.preventDefault();return;}
    if($('#modal').classList.contains('show')&&!MODAL.lock){SFX.back();closeModal(null);e.preventDefault();return;}
    if($('#drawer').classList.contains('open')){closeDrawer();e.preventDefault();return;}
    if(ACT&&ACT.mode==='move'){SFX.back();pickAct({back:true});e.preventDefault();return;}
    return;
  }
  if($('#modal').classList.contains('show'))return;
  if(k===' '||k==='Enter'){
    if(GAUGE&&GAUGE.active){gaugeThrow();e.preventDefault();return;}
    if(State.screen==='title'&&k==='Enter'){$('#btn-start').click();e.preventDefault();return;}
    if(MSG.resolve&&!ACT){advanceMsg();e.preventDefault();return;}
    return;
  }
  if(['1','2','3','4'].includes(k)&&ACT){
    const i=+k-1;
    if(ACT.mode==='action'){const btns=$$('#menu-root .action-grid .act-btn');const b=btns[i];if(b&&!b.disabled){SFX.confirm();pickAct({act:b.dataset.a});}e.preventDefault();}
    else if(ACT.mode==='move'){const btns=$$('#menu-root .move-btn');const b=btns[i];if(b&&!b.disabled){SFX.confirm();pickAct({moveIdx:+b.dataset.i});}e.preventDefault();}
  }
});
document.addEventListener('pointerdown',()=>{auInit();auResume();if(AU.ctx&&!AU.song)playSong(State.screen==='battle'?'battle':'title');},{passive:true});
/* ---------------- INIT ---------------- */
function init(){
  $('#speed-lbl').textContent='×'+State.speed;
  $('#btn-sound').classList.toggle('off',!State.sound);$('#sound-lbl').textContent=State.sound?'ON':'OFF';
  renderTitle();renderStageDots();
  fxResize();requestAnimationFrame(loop);
  const mLbl=document.createElement('span');mLbl.id='tb-stage-mini';mLbl.style.cssText='color:#fff;font-weight:900;font-size:12px;background:rgba(20,28,51,.35);padding:5px 11px;border-radius:999px;margin:0 auto;display:none';
  $('#topbar').insertBefore(mLbl,$('#btn-drawer'));
  const upd=()=>{const mob=innerWidth<=900;mLbl.style.display=mob&&State.screen==='battle'?'':'none';mLbl.textContent=`STAGE ${State.stage+1}/10`;};
  setInterval(upd,800);upd();
}
init();
